<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for OneWay Automotive</title>
<meta name="description" content="A sample homepage design made for OneWay Automotive by Hashay Patel. Not the official OneWay Automotive website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500..900&amp;family=Barlow:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0F2A2E}
*{box-sizing:border-box}
.ow{--bayou:#0F2A2E;--moss:#1B4448;--reed:#2E6A62;--cane:#F2C230;--rust:#E2622B;--mist:#EEF2EC;font-family:Barlow,system-ui,sans-serif;color:var(--mist);background:var(--bayou)}
.ow-d{font-family:'Big Shoulders Display',sans-serif;font-weight:800;letter-spacing:.005em;text-transform:uppercase}
@keyframes owSpin{to{transform:rotate(360deg)}}
@keyframes owBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes owBlink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes owScan{0%{transform:translateX(0)}100%{transform:translateX(220px)}}
.ow-wheel{transform-box:fill-box;transform-origin:center;animation:owSpin 2.6s linear infinite}
.ow-wrench{transform-box:fill-box;transform-origin:20% 80%;animation:owBob 2.2s ease-in-out infinite}
.ow-blink{animation:owBlink 1.4s ease-in-out infinite}
.ow-scan{animation:owScan 2.8s ease-in-out infinite alternate}
.ow-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:6px;font:700 17px Barlow,sans-serif;text-decoration:none;border:0;cursor:pointer}
.ow-btn:focus-visible,.ow-sym:focus-visible,.ow-nav a:focus-visible{outline:3px solid var(--cane);outline-offset:3px}
.ow-sym{min-height:64px;padding:12px 16px;border-radius:8px;cursor:pointer;font:700 16px Barlow,sans-serif;text-align:left;display:flex;align-items:center;gap:12px}
.ow-nav a{color:var(--mist);text-decoration:none;font-weight:600;opacity:.85}
.ow-nav a:hover{opacity:1;color:var(--cane)}
@media (max-width:820px){.ow-nav{display:none !important}}
@media (max-width:600px){.ow-tag{display:none}}
@media (prefers-reduced-motion:reduce){.ow-wheel,.ow-wrench,.ow-blink,.ow-scan{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="ow">
  <header style="max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" class="ow-d" style="font-size: 30px; color: var(--mist); text-decoration: none; white-space: nowrap; display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="34" height="34" viewBox="0 0 34 34"><rect width="34" height="34" rx="6" fill="#F2C230"/><path d="M8 17h14l-5-5M22 17l-5 5" stroke="#0F2A2E" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>OneWay<span class="ow-tag" style="font-family: Barlow, sans-serif; text-transform: none; font-size: 14px; font-weight: 600; opacity: .7; letter-spacing: 0">Automotive · Scott, LA</span></a>
    <nav class="ow-nav" aria-label="Main" style="display: flex; gap: 28px"><a href="#noise">What's wrong?</a><a href="#services">Services</a><a href="#reviews">Reviews</a><a href="#visit">Visit</a></nav>
    <a class="ow-btn" href="tel:+13373458997" style="min-height: 46px; padding: 0 18px; background: var(--cane); color: var(--bayou); white-space: nowrap">337-345-8997</a>
  </header>

  <section id="top" style="position: relative; overflow: hidden; border-top: 1px solid #1F4B4F">
    <div style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 80px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <p style="margin: 0; align-self: flex-start; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 6px; background: var(--moss); font-weight: 700; font-size: 15px"><span style="color: var(--cane); letter-spacing: 2px">★★★★★</span> 4.8 from 56 Google reviews</p>
        <h1 class="ow-d" style="margin: 0; font-size: clamp(56px, 8.4vw, 118px); line-height: .88">Honest repairs, straight answers.</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 540px; color: #C9D6D0">A family-owned repair shop in Scott, just outside Lafayette. Tell us what your car is doing and we'll track down the real problem.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="ow-btn" href="#noise" style="background: var(--cane); color: var(--bayou)">Check a symptom</a>
          <a class="ow-btn" href="#visit" style="background: transparent; color: var(--mist); box-shadow: inset 0 0 0 2px #3C6D6A">Book a diagnosis</a>
        </div>
      </div>
      <svg role="img" aria-label="Illustration of a car on a lift with a spinning wheel and a mechanic's wrench" viewBox="0 0 560 420" style="display: block; width: 100%; height: auto">
        <rect x="20" y="20" width="520" height="380" rx="18" fill="#163A3E"/>
        <g stroke="#2E6A62" stroke-width="2" opacity=".6"><path d="M20 120H540M20 220H540M20 320H540"/></g>
        <rect x="70" y="300" width="22" height="90" fill="#2E6A62"/><rect x="468" y="300" width="22" height="90" fill="#2E6A62"/>
        <rect x="60" y="292" width="440" height="16" rx="4" fill="#F2C230"/>
        <g fill="#0F2A2E" opacity=".35"><path d="M80 292l20 16M120 292l20 16M160 292l20 16M200 292l20 16M240 292l20 16M280 292l20 16M320 292l20 16M360 292l20 16M400 292l20 16M440 292l20 16" stroke="#0F2A2E" stroke-width="6"/></g>
        <path d="M100 250 Q104 200 160 190 L210 140 Q222 128 246 128 H352 Q376 128 392 142 L436 186 Q486 194 492 230 L494 252 Q494 262 484 262 H110 Q100 262 100 250Z" fill="#E2622B"/>
        <path d="M222 148 Q230 140 246 140 H292 V186 H186Z" fill="#9FC7C2"/><path d="M304 140 H350 Q366 140 378 150 L414 186 H304Z" fill="#9FC7C2"/>
        <rect x="112" y="214" width="26" height="12" rx="4" fill="#F2C230"/><rect x="462" y="214" width="22" height="12" rx="4" fill="#F2C230" class="ow-blink"/>
        <g class="ow-wheel"><circle cx="180" cy="262" r="38" fill="#0B1F22"/><circle cx="180" cy="262" r="20" fill="#5D7F7A"/><path d="M180 244V280M162 262H198M167 249l26 26M193 249l-26 26" stroke="#0B1F22" stroke-width="4"/></g>
        <g class="ow-wheel"><circle cx="414" cy="262" r="38" fill="#0B1F22"/><circle cx="414" cy="262" r="20" fill="#5D7F7A"/><path d="M414 244V280M396 262H432M401 249l26 26M427 249l-26 26" stroke="#0B1F22" stroke-width="4"/></g>
        <g class="ow-wrench"><path d="M400 60 l70 70" stroke="#EEF2EC" stroke-width="16" stroke-linecap="round"/><path d="M392 52 a22 22 0 1 0 22 -10 l-8 14 -12 -2 -2 -12Z" fill="#EEF2EC"/></g>
        <g><rect x="44" y="44" width="250" height="56" rx="8" fill="#0F2A2E"/><rect class="ow-scan" x="56" y="58" width="10" height="28" rx="3" fill="#F2C230" opacity=".9"/><text x="80" y="80" fill="#EEF2EC" font-family="Barlow, sans-serif" font-size="18" font-weight="700">Diagnosing…</text></g>
      </svg>
    </div>
  </section>

  <section id="noise" style="background: var(--mist); color: var(--bayou)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <h2 class="ow-d" style="margin: 0; font-size: clamp(44px, 5.6vw, 76px); line-height: .92">What is your car doing?</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3E5551; max-width: 470px">Pick the symptom that sounds closest. You'll get a plain-English idea of what it often means, so the conversation at the counter is easier.</p>
        <div role="group" aria-label="Symptoms" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 10px">
          <sc-for list="{{ syms }}" as="s" hint-placeholder-count="5"><button type="button" class="ow-sym" aria-pressed="{{ s.on }}" onClick="{{ s.pick }}" style="{{ s.style }}"><span aria-hidden="true" style="font-size: 22px; width: 28px; text-align: center">{{ s.icon }}</span>{{ s.label }}</button></sc-for>
        </div>
      </div>
      <div aria-live="polite" style="border-radius: 14px; background: var(--bayou); color: var(--mist); padding: 30px; display: flex; flex-direction: column; gap: 16px; min-height: 360px">
        <p style="margin: 0; font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--cane)">Often points to</p>
        <h3 class="ow-d" style="margin: 0; font-size: 44px; line-height: 1">{{ cause }}</h3>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #C9D6D0">{{ detail }}</p>
        <div style="display: flex; gap: 12px; align-items: flex-start; padding: 16px; border-radius: 10px; background: var(--moss)"><span aria-hidden="true" style="font-size: 20px">⚠</span><p style="margin: 0; line-height: 1.5"><strong>{{ urgency }}</strong> {{ tip }}</p></div>
        <a class="ow-btn" href="#visit" style="align-self: flex-start; background: var(--cane); color: var(--bayou)">Get it checked</a>
        <p style="margin: 0; font-size: 13px; opacity: .65">A guide only. The real answer comes from a proper look at your vehicle.</p>
      </div>
    </div>
  </section>

  <section id="services" style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
    <h2 class="ow-d" style="margin: 0 0 34px; font-size: clamp(44px, 5.6vw, 76px); line-height: .92">What we fix</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 14px">
      <article style="padding: 26px; border-radius: 12px; background: var(--moss); display: flex; flex-direction: column; gap: 10px; border-top: 5px solid var(--cane)"><h3 style="margin: 0; font-size: 22px">Problem diagnosis</h3><p style="margin: 0; line-height: 1.6; color: #C9D6D0">Vibrations, noises and warning lights tracked down to the real cause.</p></article>
      <article style="padding: 26px; border-radius: 12px; background: var(--moss); display: flex; flex-direction: column; gap: 10px; border-top: 5px solid var(--rust)"><h3 style="margin: 0; font-size: 22px">Water pumps &amp; cooling</h3><p style="margin: 0; line-height: 1.6; color: #C9D6D0">Water pump replacements and overheating problems sorted.</p></article>
      <article style="padding: 26px; border-radius: 12px; background: var(--moss); display: flex; flex-direction: column; gap: 10px; border-top: 5px solid #9FC7C2"><h3 style="margin: 0; font-size: 22px">A/C repair</h3><p style="margin: 0; line-height: 1.6; color: #C9D6D0">Warm air from the vents checked and fixed before summer hits.</p></article>
      <article style="padding: 26px; border-radius: 12px; background: var(--moss); display: flex; flex-direction: column; gap: 10px; border-top: 5px solid var(--cane)"><h3 style="margin: 0; font-size: 22px">Power steering</h3><p style="margin: 0; line-height: 1.6; color: #C9D6D0">Heavy, noisy or leaking steering looked at properly.</p></article>
    </div>
  </section>

  <section id="reviews" style="background: var(--cane); color: var(--bayou)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 34px">
        <h2 class="ow-d" style="margin: 0; font-size: clamp(44px, 5.6vw, 76px); line-height: .92">What drivers say</h2>
        <p style="margin: 0; font-weight: 700; font-size: 18px">4.8 ★ · 56 Google reviews</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">
        <figure style="margin: 0; padding: 28px; border-radius: 12px; background: var(--bayou); color: var(--mist); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 600">“Mr. Roy figured out the problem and gave me a great price for the work!”</blockquote><figcaption style="color: var(--cane); font-weight: 700">Google review</figcaption></figure>
        <figure style="margin: 0; padding: 28px; border-radius: 12px; background: var(--bayou); color: var(--mist); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 600">“Excellent service, quick turnaround, great communication and very honest!!”</blockquote><figcaption style="color: var(--cane); font-weight: 700">Google review</figcaption></figure>
        <figure style="margin: 0; padding: 28px; border-radius: 12px; background: var(--bayou); color: var(--mist); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 600">“Hands down best automotive experience I've ever had.”</blockquote><figcaption style="color: var(--cane); font-weight: 700">Google review</figcaption></figure>
      </div>
    </div>
  </section>

  <section id="visit" style="background: var(--moss)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 88px 24px 110px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 class="ow-d" style="margin: 0; font-size: clamp(44px, 5.6vw, 76px); line-height: .92">Bring it by</h2>
        <p style="margin: 0; font-size: 19px; line-height: 1.6">105 N Pat St, Bldg C<br>Scott, LA 70583</p>
        <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #C9D6D0">Mon – Fri · 8 am – 5 pm<br>Saturday · 8 am – 2 pm<br>Sunday · Closed</p>
        <p style="margin: 0; font-size: 28px; font-weight: 700"><a href="tel:+13373458997" style="color: var(--cane)">337-345-8997</a></p>
      </div>
      <form aria-label="Request a diagnosis" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; padding: 26px; border-radius: 14px; background: var(--bayou)">
        <label style="display: grid; gap: 8px; font-weight: 700">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #2B5A5C; border-radius: 8px; background: var(--moss); color: var(--mist); font: 400 16px Barlow, sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 700">Phone<input type="tel" style="min-height: 52px; padding: 0 14px; border: 2px solid #2B5A5C; border-radius: 8px; background: var(--moss); color: var(--mist); font: 400 16px Barlow, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">Year, make &amp; model<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #2B5A5C; border-radius: 8px; background: var(--moss); color: var(--mist); font: 400 16px Barlow, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">What's it doing?<textarea rows="3" style="padding: 12px 14px; border: 2px solid #2B5A5C; border-radius: 8px; background: var(--moss); color: var(--mist); font: 400 16px Barlow, sans-serif; resize: vertical"></textarea></label>
        <button type="button" class="ow-btn" style="grid-column: 1 / -1; background: var(--cane); color: var(--bayou)">Send my request</button>
      </form>
    </div>
  </section>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for OneWay Automotive. Not the official OneWay Automotive website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var self = this;
    var s = [
      { icon: "〰", label: "Shaking or vibration", cause: "Wheels, tires or driveline", detail: "A vibration that changes with speed is often a balance, tire or axle issue. One that shows up when braking can point to the brakes instead.", urgency: "Don't ignore it.", tip: "Vibrations usually get worse, and catching them early is cheaper." },
      { icon: "🌡", label: "Running hot", cause: "Cooling system or water pump", detail: "A climbing temperature gauge often comes from low coolant, a leak, a stuck thermostat or a water pump that's wearing out.", urgency: "Pull over if it's in the red.", tip: "Driving an overheating engine can cause serious damage." },
      { icon: "❄", label: "A/C blowing warm", cause: "A/C system leak or part failure", detail: "Warm air from the vents often means the system is low on refrigerant because of a leak, or a part like the compressor isn't doing its job.", urgency: "Safe to drive,", tip: "but a quick check stops a small leak becoming a big repair." },
      { icon: "⟲", label: "Steering feels heavy", cause: "Power steering system", detail: "Stiff steering, a whine when you turn, or a fluid spot under the front can point to the power steering pump, a hose or low fluid.", urgency: "Get it looked at soon.", tip: "Heavy steering makes the car harder to control." },
      { icon: "!", label: "Warning light on", cause: "A fault the computer has stored", detail: "A dash light means the car has logged a code. Reading the code is the starting point, then the real cause still needs tracking down.", urgency: "Flashing light?", tip: "Ease off and get it checked the same day." }
    ];
    var c = s[this.state.i];
    return {
      syms: s.map(function (x, i) { var on = i === self.state.i; return { icon: x.icon, label: x.label, on: on ? "true" : "false", pick: function () { self.setState({ i: i }); }, style: on ? "background:#0F2A2E;color:#EEF2EC;border:2px solid #0F2A2E" : "background:#fff;color:#0F2A2E;border:2px solid #CBD7D1" }; }),
      cause: c.cause, detail: c.detail, urgency: c.urgency, tip: c.tip
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
