<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for DE Medlock Auto and Cycle</title>
<meta name="description" content="A sample homepage design made for DE Medlock Auto and Cycle by Hashay Patel. Not the official DE Medlock Auto and Cycle website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&amp;family=Barlow:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4E6CC}
*{box-sizing:border-box}
.dm{--sand:#F4E6CC;--dune:#E8C99A;--sun:#F0832B;--rust:#B8431F;--ox:#4A1715;--oil:#1E1918;--sky:#2F6E72;font-family:Barlow,system-ui,sans-serif;color:var(--oil);background:var(--sand)}
.dm-sign{font-family:Bungee,Impact,sans-serif;font-weight:400;line-height:.95}
@keyframes dmNod{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
@keyframes dmRod{0%,100%{transform:translateY(-10px)}50%{transform:translateY(10px)}}
@keyframes dmRide{0%{transform:translateX(-260px)}100%{transform:translateX(1500px)}}
@keyframes dmSpin{to{transform:rotate(360deg)}}
@keyframes dmHeat{0%,100%{opacity:.25}50%{opacity:.6}}
.dm-beam{transform-box:fill-box;transform-origin:50% 60%;animation:dmNod 3.2s ease-in-out infinite}
.dm-rod{animation:dmRod 3.2s ease-in-out infinite}
.dm-ride{animation:dmRide 9s linear infinite}
.dm-w{transform-box:fill-box;transform-origin:center;animation:dmSpin .6s linear infinite}
.dm-heat{animation:dmHeat 2.4s ease-in-out infinite}
.dm-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:58px;padding:0 26px;border-radius:12px;font:700 17px Barlow,sans-serif;text-decoration:none;border:0;cursor:pointer}
.dm-btn:focus-visible,.dm-svc:focus-visible,.dm-tab:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.dm-svc{display:flex;align-items:center;gap:14px;width:100%;min-height:58px;padding:0 16px;border-radius:12px;cursor:pointer;font:600 16px Barlow,sans-serif;text-align:left}
.dm-tab{min-height:50px;padding:0 22px;border-radius:999px;cursor:pointer;font:700 16px Barlow,sans-serif}
.dm-nav a{color:var(--sand);text-decoration:none;font-weight:600}
.dm-nav a:hover{color:var(--sun)}
@media (max-width:820px){.dm-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.dm-beam,.dm-rod,.dm-ride,.dm-w,.dm-heat{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="dm">
  <section id="top" style="position: relative; overflow: hidden; color: var(--sand); background: linear-gradient(180deg, #2F6E72 0%, #7C6A7E 38%, #E07A3D 72%, #F0A04B 100%)">
    <header style="position: relative; z-index: 3; max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 18px">
      <a href="#top" style="display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--sand)">
        <span aria-hidden="true" class="dm-sign" style="display: grid; place-items: center; width: 54px; height: 54px; border-radius: 12px; background: var(--sand); color: var(--ox); font-size: 22px">DE</span>
        <span style="display: flex; flex-direction: column; gap: 4px">
          <span class="dm-sign" style="font-size: 22px">Medlock</span>
          <span style="font-size: 14px; font-weight: 600; opacity: .85">Auto &amp; Cycle · Odessa, Texas</span>
        </span>
      </a>
      <nav class="dm-nav" aria-label="Main" style="display: flex; gap: 30px">
        <a href="#menu">Service menu</a>
        <a href="#cycles">Cars &amp; cycles</a>
        <a href="#reviews">Reviews</a>
        <a href="#visit">Visit</a>
      </nav>
      <a class="dm-btn" href="tel:+14325822130" style="background: var(--sand); color: var(--ox); min-height: 48px">(432) 582-2130</a>
    </header>

    <div style="position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 30px 24px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 30px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <h1 class="dm-sign" style="margin: 0; font-size: clamp(54px, 7.2vw, 104px); color: #FFF3DE; text-shadow: 0 6px 0 rgba(74,23,21,.35)">Built for West Texas miles</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.6; max-width: 540px; color: #FFF3DE">Oil changes, brakes, alignments, A/C and full engine repair for cars, trucks and motorcycles. Straight answers from a shop Odessa rates 4.7 stars across 250+ Google reviews.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="dm-btn" href="#menu" style="background: var(--ox); color: #FFF3DE">Build your visit</a>
          <a class="dm-btn" href="tel:+14325822130" style="background: rgba(255,243,222,.16); color: #FFF3DE; box-shadow: inset 0 0 0 2px rgba(255,243,222,.6)">Call the shop</a>
        </div>
      </div>
      <aside aria-label="Shop status" style="justify-self: end; width: min(100%, 380px); background: var(--sand); color: var(--oil); border-radius: 18px; padding: 22px; box-shadow: 0 30px 60px -30px rgba(74,23,21,.8); transform: rotate(1.5deg)">
        <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px dashed #CFAE7E; padding-bottom: 14px">
          <span class="dm-sign" style="font-size: 20px; color: var(--rust)">Shop hours</span>
          <span style="font-weight: 700; color: var(--ox)">★ 4.7 · 252 reviews</span>
        </div>
        <dl style="margin: 14px 0 0; display: grid; grid-template-columns: 1fr auto; gap: 10px 16px; font-size: 17px">
          <dt style="font-weight: 600">Monday – Friday</dt><dd style="margin: 0; font-weight: 700">7 am – 6 pm</dd>
          <dt style="font-weight: 600">Saturday</dt><dd style="margin: 0; font-weight: 700">7 am – noon</dd>
          <dt style="font-weight: 600">Sunday</dt><dd style="margin: 0; color: #8A6B4D">Closed</dd>
        </dl>
        <p style="margin: 16px 0 0; padding-top: 14px; border-top: 2px dashed #CFAE7E; font-size: 15px; color: #6A4A33">701 Express Way, Odessa, TX 79761</p>
      </aside>
    </div>

    <svg role="img" aria-label="Pumpjacks nodding at sunset while a motorcycle rides past the Medlock shop" viewBox="0 0 1440 330" style="position: relative; z-index: 1; display: block; width: 100%; height: auto; margin-top: -30px">
      <circle cx="1080" cy="210" r="120" fill="#FFD27A" opacity=".85"/>
      <circle class="dm-heat" cx="1080" cy="210" r="170" fill="#FFD27A" opacity=".3"/>
      <path d="M0 200 Q240 160 480 196 T960 186 T1440 196 V330 H0Z" fill="#B8431F"/>
      <path d="M0 236 Q300 210 620 238 T1440 228 V330 H0Z" fill="#7A2A1A"/>
      <g transform="translate(180 92)" fill="#1E1918">
        <rect x="70" y="40" width="10" height="110"/><path d="M40 150 L75 40 L110 150Z" fill="none" stroke="#1E1918" stroke-width="8"/>
        <g class="dm-beam"><rect x="-30" y="26" width="210" height="16" rx="6"/><path d="M-30 20 Q-58 34 -30 60Z"/></g>
        <rect class="dm-rod" x="-34" y="60" width="6" height="80"/>
        <rect x="140" y="110" width="44" height="40" rx="6"/>
      </g>
      <g transform="translate(1180 120) scale(.7)" fill="#1E1918">
        <rect x="70" y="40" width="10" height="110"/><path d="M40 150 L75 40 L110 150Z" fill="none" stroke="#1E1918" stroke-width="8"/>
        <g class="dm-beam" style="animation-delay:-1.2s"><rect x="-30" y="26" width="210" height="16" rx="6"/><path d="M-30 20 Q-58 34 -30 60Z"/></g>
        <rect class="dm-rod" x="-34" y="60" width="6" height="80" style="animation-delay:-1.2s"/>
      </g>
      <g transform="translate(560 128)">
        <rect x="0" y="40" width="300" height="116" fill="#4A1715"/>
        <path d="M-14 40 L150 0 L314 40Z" fill="#2B0E0D"/>
        <rect x="30" y="70" width="110" height="86" fill="#1E1918"/><rect x="34" y="74" width="102" height="10" fill="#F0832B" opacity=".9"/>
        <rect x="170" y="74" width="100" height="40" rx="4" fill="#F4E6CC"/>
        <text x="220" y="99" text-anchor="middle" font-family="Bungee, Impact" font-size="16" fill="#B8431F">MEDLOCK</text>
      </g>
      <rect y="292" width="1440" height="38" fill="#1E1918"/>
      <g fill="#F0C27A"><rect x="40" y="309" width="60" height="4"/><rect x="220" y="309" width="60" height="4"/><rect x="400" y="309" width="60" height="4"/><rect x="580" y="309" width="60" height="4"/><rect x="760" y="309" width="60" height="4"/><rect x="940" y="309" width="60" height="4"/><rect x="1120" y="309" width="60" height="4"/><rect x="1300" y="309" width="60" height="4"/></g>
      <g class="dm-ride"><g transform="translate(300 236)">
        <g class="dm-w"><circle cx="20" cy="44" r="18" fill="none" stroke="#1E1918" stroke-width="7"/><path d="M20 28 V60 M4 44 H36" stroke="#1E1918" stroke-width="2"/></g>
        <g class="dm-w"><circle cx="104" cy="44" r="18" fill="none" stroke="#1E1918" stroke-width="7"/><path d="M104 28 V60 M88 44 H120" stroke="#1E1918" stroke-width="2"/></g>
        <path d="M20 44 L50 22 H82 L104 44 M50 22 L62 40 H86" stroke="#1E1918" stroke-width="6" fill="none" stroke-linecap="round"/>
        <path d="M44 14 Q62 4 84 16 L80 24 H48Z" fill="#B8431F"/>
        <circle cx="64" cy="-6" r="9" fill="#1E1918"/><path d="M60 2 L70 20 L86 24" stroke="#1E1918" stroke-width="7" fill="none" stroke-linecap="round"/>
      </g></g>
    </svg>
  </section>

  <section id="menu" style="max-width: 1280px; margin: 0 auto; padding: 100px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 48px; align-items: start">
    <div style="display: flex; flex-direction: column; gap: 18px; position: sticky; top: 24px">
      <h2 class="dm-sign" style="margin: 0; font-size: clamp(40px, 5vw, 66px); color: var(--ox)">Build your visit</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.65; color: #5A4434; max-width: 460px">Tap what your car, truck or bike needs. We'll have it ready on the ticket when you call or pull in.</p>
      <div style="margin-top: 8px; border-radius: 18px; background: var(--oil); color: var(--sand); padding: 26px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span class="dm-sign" style="font-size: 18px; color: var(--sun)">Your ticket</span><span style="font-weight: 700">{{ count }}</span></div>
        <p style="margin: 0; font-size: 17px; line-height: 1.55; color: #E6D5BB">{{ summary }}</p>
        <a class="dm-btn" href="tel:+14325822130" style="background: var(--sun); color: var(--oil)">Call to book it in</a>
      </div>
    </div>
    <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 10px">
      <sc-for list="{{ svcs }}" as="s" hint-placeholder-count="10">
        <li><button type="button" class="dm-svc" aria-pressed="{{ s.on }}" onClick="{{ s.toggle }}" style="{{ s.style }}"><span aria-hidden="true" style="{{ s.box }}">{{ s.mark }}</span>{{ s.name }}</button></li>
      </sc-for>
    </ul>
  </section>

  <section id="cycles" style="background: var(--ox); color: var(--sand)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 100px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 48px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 20px">
        <h2 class="dm-sign" style="margin: 0; font-size: clamp(40px, 5vw, 66px)">Two wheels or four</h2>
        <div role="tablist" aria-label="Vehicle type" style="display: flex; gap: 10px; flex-wrap: wrap">
          <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="2">
            <button type="button" role="tab" class="dm-tab" aria-selected="{{ t.sel }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.label }}</button>
          </sc-for>
        </div>
        <p style="margin: 0; font-size: 19px; line-height: 1.65; color: #F0DCC0; max-width: 520px">{{ veh.text }}</p>
        <ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{ veh.tags }}" as="g" hint-placeholder-count="4">
            <li style="padding: 9px 16px; border-radius: 999px; background: rgba(244,230,204,.12); font-weight: 600">{{ g.t }}</li>
          </sc-for>
        </ul>
      </div>
      <div style="position: relative; aspect-ratio: 4 / 3; border-radius: 24px; background: radial-gradient(circle at 60% 40%, #F0832B 0 30%, #B8431F 31% 55%, #7A2A1A 56%); display: grid; place-items: center; overflow: hidden">
        <span class="dm-sign" style="position: absolute; top: 22px; left: 26px; font-size: 18px; color: var(--sand)">{{ veh.badge }}</span>
        <span aria-hidden="true" style="font-size: clamp(110px, 16vw, 200px); filter: drop-shadow(0 20px 20px rgba(0,0,0,.35))">{{ veh.icon }}</span>
      </div>
    </div>
  </section>

  <section id="reviews" style="max-width: 1280px; margin: 0 auto; padding: 100px 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 40px">
      <h2 class="dm-sign" style="margin: 0; font-size: clamp(40px, 5vw, 66px); color: var(--ox)">Odessa says</h2>
      <p style="margin: 0; font-size: 18px; font-weight: 700; color: var(--rust)">★ 4.7 average across 252 Google reviews</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 18px">
      <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="3">
        <figure style="{{ r.style }}">
          <span aria-hidden="true" style="color: inherit; font-size: 20px; letter-spacing: 2px">★★★★★</span>
          <blockquote style="margin: 0; font-size: 22px; line-height: 1.4; font-weight: 600">"{{ r.q }}"</blockquote>
          <figcaption style="margin-top: auto; font-size: 14px; opacity: .75">Google review</figcaption>
        </figure>
      </sc-for>
    </div>
  </section>

  <section id="visit" style="background: var(--dune)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 90px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <h2 class="dm-sign" style="margin: 0; font-size: clamp(38px, 4.6vw, 60px); color: var(--ox)">701 Express Way</h2>
        <p style="margin: 0; font-size: 19px; color: #5A4434">Odessa, TX 79761 · Mon–Fri 7–6 · Sat 7–noon</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px">
          <a class="dm-btn" href="tel:+14325822130" style="background: var(--ox); color: var(--sand)">Call (432) 582-2130</a>
          <a class="dm-btn" href="mailto:demedlockautoandcycle@gmail.com" style="background: transparent; color: var(--ox); box-shadow: inset 0 0 0 2px var(--ox)">Email the shop</a>
        </div>
      </div>
      <form aria-label="Request a callback" style="display: grid; gap: 14px; background: var(--sand); padding: 28px; border-radius: 20px; box-shadow: 0 24px 50px -30px rgba(74,23,21,.6)">
        <p class="dm-sign" style="margin: 0; font-size: 22px; color: var(--rust)">Get a call back</p>
        <label style="display: grid; gap: 6px; font-weight: 600">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #D9BF95; border-radius: 10px; font: 400 16px Barlow, sans-serif; background: #FFF9EE"></label>
        <label style="display: grid; gap: 6px; font-weight: 600">Phone<input type="tel" style="min-height: 52px; padding: 0 14px; border: 2px solid #D9BF95; border-radius: 10px; font: 400 16px Barlow, sans-serif; background: #FFF9EE"></label>
        <label style="display: grid; gap: 6px; font-weight: 600">Year, make &amp; model<input type="text" placeholder="e.g. 2016 Toyota Tundra" style="min-height: 52px; padding: 0 14px; border: 2px solid #D9BF95; border-radius: 10px; font: 400 16px Barlow, sans-serif; background: #FFF9EE"></label>
        <button type="button" class="dm-btn" style="background: var(--sun); color: var(--oil)">Request call back</button>
      </form>
    </div>
  </section>

  <footer style="background: var(--oil); color: #CDB89A">
    <div style="max-width: 1280px; margin: 0 auto; padding: 32px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; font-size: 14px">
      <span class="dm-sign" style="color: var(--sand); font-size: 18px">DE Medlock Auto &amp; Cycle LLC</span>
      <span>701 Express Way, Odessa, TX · (432) 582-2130 · demedlockautoandcycle@gmail.com</span>
    </div>
  </footer>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for DE Medlock Auto and Cycle. Not the official DE Medlock Auto and Cycle website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: { oil: true, brakes: true }, v: "car" }; }
  renderVals() {
    var self = this;
    var list = [
      ["oil", "Oil change"], ["brakes", "Brakes"], ["align", "Alignment"], ["ac", "A/C repair"],
      ["engine", "Engine repair"], ["tune", "Tune-up"], ["start", "Starting & charging"], ["tires", "Tires"],
      ["cool", "Radiator & cooling"], ["diag", "Check engine light"]
    ];
    var picked = this.state.picked;
    var svcs = list.map(function (x) {
      var on = !!picked[x[0]];
      return {
        name: x[1], on: on ? "true" : "false", mark: on ? "✓" : "",
        toggle: function () { var p = Object.assign({}, self.state.picked); p[x[0]] = !p[x[0]]; self.setState({ picked: p }); },
        style: on ? "background:#4A1715;color:#F4E6CC;border:2px solid #4A1715" : "background:#FFF9EE;color:#1E1918;border:2px solid #E2C9A0",
        box: "display:grid;place-items:center;width:26px;height:26px;border-radius:7px;font-weight:800;" + (on ? "background:#F0832B;color:#1E1918" : "border:2px solid #CFAE7E")
      };
    });
    var names = list.filter(function (x) { return picked[x[0]]; }).map(function (x) { return x[1].toLowerCase(); });
    var n = names.length;
    var veh = this.state.v === "car" ? {
      text: "Daily drivers, work trucks and family SUVs. From a quick oil change to replacing a water pump, radiator and thermostat in one visit.",
      tags: ["Cars", "Pickups", "SUVs", "Work trucks"], icon: "🛻", badge: "Cars & trucks"
    } : {
      text: "Medlock is an auto and cycle shop, so your motorcycle gets the same careful hands as your truck. Service, tires and repairs for bikes too.",
      tags: ["Street bikes", "Cruisers", "Service", "Tires"], icon: "🏍️", badge: "Motorcycles"
    };
    return {
      svcs: svcs,
      count: n + (n === 1 ? " item" : " items"),
      summary: n ? "You picked " + names.join(", ") + "." : "Nothing picked yet. Tap a service to add it.",
      tabs: [["car", "Cars & trucks"], ["cycle", "Motorcycles"]].map(function (t) {
        var on = self.state.v === t[0];
        return { label: t[1], sel: on ? "true" : "false", pick: function () { self.setState({ v: t[0] }); },
          style: on ? "background:#F0832B;color:#1E1918;border:2px solid #F0832B" : "background:transparent;color:#F4E6CC;border:2px solid rgba(244,230,204,.4)" };
      }),
      veh: { text: veh.text, icon: veh.icon, badge: veh.badge, tags: veh.tags.map(function (t) { return { t: t }; }) },
