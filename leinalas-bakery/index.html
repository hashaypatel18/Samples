<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Leinala&#x27;s Bakery</title>
<meta name="description" content="A sample homepage design made for Leinala&#x27;s Bakery by Hashay Patel. Not the official Leinala&#x27;s Bakery website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;family=Figtree:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F7FD}
*{box-sizing:border-box}
.lb{--blue:#1C4FA0;--deep:#0E2A5C;--snow:#F4F7FD;--ice:#DCE6F7;--pink:#F49AC1;--rye:#6B3E22;--glaze:#FFE07A;font-family:Figtree,system-ui,sans-serif;color:var(--deep);background:var(--snow)}
.lb-d{font-family:Fredoka,sans-serif;font-weight:600;letter-spacing:-.01em}
@keyframes lbFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
@keyframes lbSteam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.7}100%{opacity:0;transform:translateY(-22px)}}
@keyframes lbSnow{to{transform:translateY(420px)}}
.lb-pig{transform-box:fill-box;transform-origin:center;animation:lbFloat 4s ease-in-out infinite}
.lb-steam path{animation:lbSteam 2.6s ease-out infinite}
.lb-steam path:nth-child(2){animation-delay:.8s}.lb-steam path:nth-child(3){animation-delay:1.6s}
.lb-flake{animation:lbSnow 9s linear infinite}
.lb-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:999px;font:700 17px Figtree,sans-serif;text-decoration:none;border:0;cursor:pointer}
.lb-btn:focus-visible,.lb-item:focus-visible,.lb-nav a:focus-visible{outline:3px solid var(--pink);outline-offset:3px}
.lb-item{min-height:64px;padding:10px 14px;border-radius:16px;cursor:pointer;font:700 16px Figtree,sans-serif;display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.lb-nav a{color:var(--deep);text-decoration:none;font-weight:700}
.lb-nav a:hover{color:var(--blue)}
@media (max-width:820px){.lb-nav{display:none !important}}
@media (max-width:600px){.lb-tag{display:none}}
@media (prefers-reduced-motion:reduce){.lb-pig,.lb-steam path,.lb-flake{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="lb">
  <header style="max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" class="lb-d" style="font-size: 30px; color: var(--blue); text-decoration: none; white-space: nowrap; display: flex; align-items: baseline; gap: 10px">Leinala's<span class="lb-tag" style="font-family: Figtree, sans-serif; font-size: 14px; font-weight: 700; color: var(--deep); opacity: .65">Finnish bakery · Sudbury · since 1961</span></a>
    <nav class="lb-nav" aria-label="Main" style="display: flex; gap: 28px"><a href="#box">Build a box</a><a href="#bakes">Our baking</a><a href="#reviews">Reviews</a><a href="#visit">Visit</a></nav>
    <a class="lb-btn" href="tel:+17055221977" style="min-height: 46px; padding: 0 18px; background: var(--blue); color: #fff; white-space: nowrap">705-522-1977</a>
  </header>

  <section id="top" style="position: relative; overflow: hidden; background: var(--blue); color: #fff">
    <svg aria-hidden="true" viewBox="0 0 1440 420" preserveAspectRatio="none" style="position: absolute; inset: 0; width: 100%; height: 100%; opacity: .16"><g fill="#fff"><circle class="lb-flake" cx="120" cy="-20" r="4"/><circle class="lb-flake" cx="380" cy="-60" r="3" style="animation-delay: -3s"/><circle class="lb-flake" cx="700" cy="-30" r="5" style="animation-delay: -6s"/><circle class="lb-flake" cx="980" cy="-80" r="3" style="animation-delay: -2s"/><circle class="lb-flake" cx="1260" cy="-40" r="4" style="animation-delay: -5s"/></g></svg>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 56px 24px 84px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <p style="margin: 0; align-self: flex-start; padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.14); font-weight: 700; font-size: 15px"><span style="color: var(--glaze)">★ 4.8</span> from 243 Google reviews</p>
        <h1 class="lb-d" style="margin: 0; font-size: clamp(54px, 8vw, 112px); line-height: .95">Home of the Jelly Pig.</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 520px; color: #DCE6F7">Traditional Finnish baking in Sudbury since 1961. Pulla, cakes, breads, cookies, handheld meat pies, a deli and imported Finnish foods.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="lb-btn" href="#box" style="background: var(--pink); color: var(--deep)">Build a treat box</a>
          <a class="lb-btn" href="#visit" style="background: transparent; color: #fff; box-shadow: inset 0 0 0 2px rgba(255,255,255,.5)">Hours &amp; directions</a>
        </div>
      </div>
      <svg role="img" aria-label="Illustration of a jelly-filled pig-shaped doughnut floating above a plate, with steam rising" viewBox="0 0 520 440" style="display: block; width: 100%; height: auto">
        <rect x="40" y="40" width="440" height="360" rx="200" fill="#2B5FB4"/>
        <path d="M40 210 H480 M250 40 V400" stroke="#fff" stroke-width="40" opacity=".12"/>
        <ellipse cx="260" cy="356" rx="170" ry="26" fill="#0E2A5C" opacity=".35"/>
        <ellipse cx="260" cy="344" rx="180" ry="30" fill="#fff"/><ellipse cx="260" cy="340" rx="140" ry="18" fill="#DCE6F7"/>
        <g class="lb-steam" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round"><path d="M220 120 q-12 -16 0 -32"/><path d="M262 110 q-12 -16 0 -32"/><path d="M304 120 q-12 -16 0 -32"/></g>
        <g class="lb-pig">
          <path d="M162 206 l-18 -40 l40 18Z" fill="#D9945A"/><path d="M350 206 l18 -40 l-40 18Z" fill="#D9945A"/>
          <ellipse cx="256" cy="236" rx="118" ry="96" fill="#E7A867"/>
          <ellipse cx="256" cy="228" rx="104" ry="80" fill="#F2C089"/>
          <g fill="#fff" opacity=".9"><circle cx="196" cy="178" r="4"/><circle cx="226" cy="164" r="3"/><circle cx="300" cy="170" r="4"/><circle cx="318" cy="200" r="3"/><circle cx="180" cy="214" r="3"/><circle cx="332" cy="240" r="3"/><circle cx="200" cy="270" r="4"/><circle cx="310" cy="280" r="3"/></g>
          <ellipse cx="256" cy="252" rx="40" ry="28" fill="#F49AC1"/><ellipse cx="242" cy="252" rx="7" ry="10" fill="#C2577F"/><ellipse cx="270" cy="252" rx="7" ry="10" fill="#C2577F"/>
          <circle cx="212" cy="214" r="9" fill="#0E2A5C"/><circle cx="300" cy="214" r="9" fill="#0E2A5C"/>
          <path d="M256 304 q14 18 34 6" stroke="#B5345E" stroke-width="10" fill="none" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
  </section>

  <section id="box" style="max-width: 1280px; margin: 0 auto; padding: 92px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: start">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <h2 class="lb-d" style="margin: 0; font-size: clamp(42px, 5.4vw, 72px); line-height: 1">Build a treat box</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3B4F75; max-width: 470px">Tap to add favourites to your box, then call ahead so they're waiting for you. Tap the minus to take one out.</p>
      <div style="display: grid; gap: 10px">
        <sc-for list="{{ items }}" as="t" hint-placeholder-count="5"><div style="display: flex; gap: 8px"><button type="button" class="lb-item" onClick="{{ t.add }}" aria-label="{{ t.addLabel }}" style="flex: 1; background: #fff; color: var(--deep); border: 2px solid var(--ice)"><span><span aria-hidden="true" style="display: inline-block; width: 14px; height: 14px; border-radius: 50%; margin-right: 10px; background: {{ t.color }}"></span>{{ t.name }}</span><span style="font-size: 14px; color: #3B4F75">{{ t.note }}</span></button><button type="button" class="lb-item" onClick="{{ t.sub }}" aria-label="{{ t.subLabel }}" style="width: 64px; justify-content: center; background: var(--ice); color: var(--deep); border: 0; font-size: 24px">−</button></div></sc-for>
      </div>
    </div>
    <div aria-live="polite" style="border-radius: 28px; background: var(--deep); color: #fff; padding: 30px; display: flex; flex-direction: column; gap: 18px">
      <svg role="img" aria-label="{{ alt }}" viewBox="0 0 440 220" style="display: block; width: 100%; height: auto">
        <path d="M30 70 H410 L390 200 H50Z" fill="#fff"/><path d="M30 70 H410 L400 96 H40Z" fill="#DCE6F7"/>
        <path d="M30 70 L60 20 H380 L410 70Z" fill="#1C4FA0"/><path d="M200 20 H240 V70 H200Z" fill="#F49AC1"/>
        <sc-for list="{{ dots }}" as="d" hint-placeholder-count="6"><circle cx="{{ d.x }}" cy="{{ d.y }}" r="22" fill="{{ d.c }}" stroke="#0E2A5C" stroke-opacity=".15" stroke-width="3"/></sc-for>
      </svg>
      <p class="lb-d" style="margin: 0; font-size: 34px">{{ count }}</p>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #DCE6F7">{{ list }}</p>
      <a class="lb-btn" href="tel:+17055221977" style="align-self: flex-start; background: var(--pink); color: var(--deep)">Call to set it aside</a>
    </div>
  </section>

  <section id="bakes" style="background: var(--ice)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
      <h2 class="lb-d" style="margin: 0 0 34px; font-size: clamp(42px, 5.4vw, 72px); line-height: 1">From our ovens and shelves</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px">
        <article style="padding: 28px; border-radius: 24px; background: #fff; display: flex; flex-direction: column; gap: 10px"><span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: var(--pink)"></span><h3 style="margin: 0; font-size: 22px">Jelly Pigs &amp; doughnuts</h3><p style="margin: 0; line-height: 1.6; color: #3B4F75">The bakery's signature, plus the much-loved pink cookies.</p></article>
        <article style="padding: 28px; border-radius: 24px; background: #fff; display: flex; flex-direction: column; gap: 10px"><span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: #E7A867"></span><h3 style="margin: 0; font-size: 22px">Scandinavian pulla</h3><p style="margin: 0; line-height: 1.6; color: #3B4F75">Finnish sweet bread, alongside cakes, breads and cookies.</p></article>
        <article style="padding: 28px; border-radius: 24px; background: #fff; display: flex; flex-direction: column; gap: 10px"><span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: var(--rye)"></span><h3 style="margin: 0; font-size: 22px">Meat pies &amp; deli</h3><p style="margin: 0; line-height: 1.6; color: #3B4F75">Handheld meat pies and a deli counter for lunch on the go.</p></article>
        <article style="padding: 28px; border-radius: 24px; background: var(--blue); color: #fff; display: flex; flex-direction: column; gap: 10px"><span aria-hidden="true" style="width: 48px; height: 48px; border-radius: 50%; background: #fff"></span><h3 style="margin: 0; font-size: 22px">Imported foods &amp; sauna</h3><p style="margin: 0; line-height: 1.6; color: #DCE6F7">Imported Finnish foods, gifts and sauna supplies.</p></article>
      </div>
    </div>
  </section>

  <section id="reviews" style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 34px">
      <h2 class="lb-d" style="margin: 0; font-size: clamp(42px, 5.4vw, 72px); line-height: 1">Sudbury's sweet tooth agrees</h2>
      <p style="margin: 0; font-weight: 800; font-size: 18px; color: var(--blue)">4.8 ★ · 243 Google reviews</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">
      <figure style="margin: 0; padding: 28px; border-radius: 24px; background: var(--deep); color: #fff; display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 20px; line-height: 1.5; font-weight: 600">“The best. I can't find these types of baked goods anywhere else. Of course, the jelly pigs and pulla are phenomenal, but the pink cookies will always be my favourite :)”</blockquote><figcaption style="color: var(--pink); font-weight: 800">Google review</figcaption></figure>
      <figure style="margin: 0; padding: 28px; border-radius: 24px; background: var(--pink); color: var(--deep); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 20px; line-height: 1.5; font-weight: 600">“The jelly pigs wow! Absolutely yummy!! The owner was so friendly and sweet.”</blockquote><figcaption style="font-weight: 800">Google review</figcaption></figure>
      <figure style="margin: 0; padding: 28px; border-radius: 24px; background: var(--blue); color: #fff; display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 20px; line-height: 1.5; font-weight: 600">“Staff is friendly, good selection of food”</blockquote><figcaption style="color: var(--glaze); font-weight: 800">Google review</figcaption></figure>
    </div>
  </section>

  <section id="visit" style="background: var(--deep); color: #fff">
    <div style="max-width: 1280px; margin: 0 auto; padding: 88px 24px 110px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 class="lb-d" style="margin: 0; font-size: clamp(42px, 5.4vw, 72px); line-height: 1">Come say hei</h2>
        <p style="margin: 0; font-size: 19px; line-height: 1.6">1769 Regent Street<br>Sudbury, ON P3E 3Z7</p>
        <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #DCE6F7">Monday · 8 am – 4 pm<br>Tuesday – Friday · 8 am – 5 pm<br>Saturday · 8 am – 4 pm<br>Sunday · Closed</p>
        <p style="margin: 0; font-size: 28px; font-weight: 800"><a href="tel:+17055221977" style="color: var(--pink)">705-522-1977</a></p>
      </div>
      <form aria-label="Order request" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; padding: 26px; border-radius: 24px; background: #fff; color: var(--deep)">
        <label style="display: grid; gap: 8px; font-weight: 700">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid var(--ice); border-radius: 14px; font: 400 16px Figtree, sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 700">Phone<input type="tel" style="min-height: 52px; padding: 0 14px; border: 2px solid var(--ice); border-radius: 14px; font: 400 16px Figtree, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">Pick-up day<input type="text" placeholder="e.g. Saturday morning" style="min-height: 52px; padding: 0 14px; border: 2px solid var(--ice); border-radius: 14px; font: 400 16px Figtree, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">What would you like?<textarea rows="3" style="padding: 12px 14px; border: 2px solid var(--ice); border-radius: 14px; font: 400 16px Figtree, sans-serif; resize: vertical"></textarea></label>
        <button type="button" class="lb-btn" style="grid-column: 1 / -1; background: var(--blue); color: #fff">Send my order request</button>
      </form>
    </div>
  </section>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Leinala&#x27;s Bakery. Not the official Leinala&#x27;s Bakery website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { q: [2, 1, 2, 0, 0] }; }
  renderVals() {
    var self = this;
    var it = [
      { name: "Jelly Pig", color: "#F2C089" },
      { name: "Pulla", color: "#E7A867" },
      { name: "Pink cookie", color: "#F49AC1" },
      { name: "Meat pie", color: "#6B3E22" },
      { name: "Doughnut", color: "#FFE07A" }
    ];
    var q = this.state.q;
    function set(i, d) { var n = q.slice(); n[i] = Math.max(0, Math.min(6, n[i] + d)); self.setState({ q: n }); }
    var total = q.reduce(function (a, b) { return a + b; }, 0);
    var dots = [], k = 0;
    it.forEach(function (x, i) { for (var j = 0; j < q[i] && k < 12; j++, k++) { dots.push({ x: 90 + (k % 6) * 52, y: k < 6 ? 128 : 176, c: x.color }); } });
    var parts = it.map(function (x, i) { return q[i] ? q[i] + " × " + x.name : ""; }).filter(Boolean);
    return {
      items: it.map(function (x, i) { return { name: x.name, color: x.color, note: q[i] ? "In box: " + q[i] : "Tap to add", add: function () { set(i, 1); }, sub: function () { set(i, -1); }, addLabel: "Add a " + x.name, subLabel: "Remove a " + x.name }; }),
      dots: dots,
      count: total === 0 ? "Your box is empty" : total + (total === 1 ? " treat in your box" : " treats in your box"),
      list: parts.length ? parts.join(" · ") : "Tap a treat on the left to start.",
      alt: "Treat box holding " + total + " items"
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
