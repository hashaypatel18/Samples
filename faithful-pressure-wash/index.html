<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Faithful Pressure Wash</title>
<meta name="description" content="A sample homepage design made for Faithful Pressure Wash by Hashay Patel. Not the official Faithful Pressure Wash website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=Outfit:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7FAFC}
*{box-sizing:border-box}
.fw{--slate:#1D2A35;--rock:#33424F;--sky:#58B7EC;--deep:#1679B8;--wheat:#E9B949;--grime:#7B6A55;--white:#F7FAFC;font-family:Outfit,system-ui,sans-serif;color:var(--slate);background:var(--white)}
.fw-d{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em}
@keyframes fwSweep{0%{transform:translateX(0)}100%{transform:translateX(300px)}}
@keyframes fwDrop{0%{transform:translate(0,0);opacity:1}100%{transform:translate(-30px,60px);opacity:0}}
@keyframes fwReveal{0%{width:0}100%{width:300px}}
.fw-wand{animation:fwSweep 3.4s ease-in-out infinite alternate}
.fw-drop{animation:fwDrop 1s linear infinite}
.fw-drop:nth-child(2){animation-delay:.33s}.fw-drop:nth-child(3){animation-delay:.66s}
.fw-clean{animation:fwReveal 3.4s ease-in-out infinite alternate}
.fw-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:14px;font:700 17px Outfit,sans-serif;text-decoration:none;border:0;cursor:pointer}
.fw-btn:focus-visible,.fw-nav a:focus-visible,.fw-range:focus-visible{outline:3px solid var(--wheat);outline-offset:3px}
.fw-range{width:100%;height:44px;accent-color:#1679B8;cursor:pointer}
.fw-nav a{color:var(--white);text-decoration:none;font-weight:600;opacity:.9}
.fw-nav a:hover{opacity:1;color:var(--sky)}
@media (max-width:820px){.fw-nav{display:none !important}}
@media (max-width:600px){.fw-tag{display:none}.fw-logo{font-size:26px !important;white-space:normal !important}}
@media (prefers-reduced-motion:reduce){.fw-wand,.fw-drop,.fw-clean{animation:none}.fw-clean{width:180px}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="fw">
  <div style="background: var(--slate); color: var(--white)">
  <header style="max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" class="fw-d fw-logo" style="font-size: 34px; color: var(--white); text-decoration: none; white-space: nowrap; line-height: 1">Faithful <span style="color: var(--sky)">Pressure Wash</span><span class="fw-tag" style="font-family: Outfit, sans-serif; font-size: 14px; font-weight: 600; margin-left: 10px; opacity: .7; letter-spacing: 0">Billings, MT</span></a>
    <nav class="fw-nav" aria-label="Main" style="display: flex; gap: 28px"><a href="#clean">See the difference</a><a href="#services">Services</a><a href="#reviews">Reviews</a><a href="#quote">Free quote</a></nav>
    <a class="fw-btn" href="tel:+14066970192" style="min-height: 46px; padding: 0 18px; background: var(--sky); color: var(--slate); white-space: nowrap">406-697-0192</a>
  </header>

  <section id="top" style="position: relative; overflow: hidden">
    <div style="max-width: 1280px; margin: 0 auto; padding: 44px 24px 84px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 22px">
        <p style="margin: 0; align-self: flex-start; padding: 8px 14px; border-radius: 10px; background: var(--rock); font-weight: 600; font-size: 15px"><span style="color: var(--wheat)">★ 5.0</span> from 79 Google reviews</p>
        <h1 class="fw-d" style="margin: 0; font-size: clamp(64px, 9.6vw, 140px); line-height: .86">Big Sky clean, top to bottom.</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.55; max-width: 540px; color: #C6D3DD">House washing, driveways, gutters, shops and fleet vehicles across Billings. A faith-based business that loves serving its community.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="fw-btn" href="#quote" style="background: var(--sky); color: var(--slate)">Get a free quote</a>
          <a class="fw-btn" href="#clean" style="background: transparent; color: var(--white); box-shadow: inset 0 0 0 2px #4B5D6C">See the difference</a>
        </div>
      </div>
      <svg role="img" aria-label="Illustration of a pressure washer wand spraying a dirty driveway clean in front of a house" viewBox="0 0 560 420" style="display: block; width: 100%; height: auto">
        <rect x="20" y="20" width="520" height="380" rx="22" fill="#2A3946"/>
        <path d="M20 170 L120 110 L200 150 L300 90 L400 140 L540 80 V200 H20Z" fill="#33424F"/>
        <path d="M150 230 L270 150 L390 230Z" fill="#E9B949"/><rect x="170" y="228" width="200" height="90" fill="#F7FAFC"/>
        <rect x="250" y="262" width="40" height="56" fill="#1679B8"/><rect x="190" y="248" width="40" height="34" fill="#58B7EC"/><rect x="310" y="248" width="40" height="34" fill="#58B7EC"/>
        <rect x="60" y="318" width="420" height="60" rx="6" fill="#7B6A55"/>
        <g fill="#5E5040" opacity=".7"><circle cx="110" cy="345" r="9"/><circle cx="210" cy="358" r="7"/><circle cx="330" cy="340" r="10"/><circle cx="420" cy="360" r="8"/></g>
        <rect class="fw-clean" x="90" y="318" width="180" height="60" fill="#D9E3EA"/>
        <g class="fw-wand">
          <path d="M60 210 L118 300" stroke="#E9B949" stroke-width="10" stroke-linecap="round"/>
          <rect x="40" y="186" width="40" height="30" rx="6" fill="#F7FAFC"/>
          <path d="M118 300 L84 318 M118 300 L118 318 M118 300 L150 318" stroke="#58B7EC" stroke-width="4" opacity=".9"/>
          <g fill="#58B7EC"><circle class="fw-drop" cx="120" cy="312" r="4"/><circle class="fw-drop" cx="132" cy="308" r="3"/><circle class="fw-drop" cx="108" cy="310" r="3"/></g>
        </g>
      </svg>
    </div>
  </section>
  </div>

  <section id="clean" style="max-width: 1280px; margin: 0 auto; padding: 92px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <h2 class="fw-d" style="margin: 0; font-size: clamp(52px, 6.4vw, 92px); line-height: .9">Slide to wash it</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #4A5A68; max-width: 470px">Drag the slider to run the wand across a grimy driveway, then pick what you'd like cleaned at your place.</p>
      <label style="display: grid; gap: 8px; font-weight: 700">How much is clean: {{ pct }}%<input class="fw-range" type="range" min="0" max="100" value="{{ pct }}" onInput="{{ slide }}" aria-label="Amount cleaned"></label>
      <div role="group" aria-label="Surface" style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ surfs }}" as="s" hint-placeholder-count="4"><button type="button" class="fw-btn" aria-pressed="{{ s.on }}" onClick="{{ s.pick }}" style="{{ s.style }}">{{ s.name }}</button></sc-for>
      </div>
    </div>
    <div style="border-radius: 24px; background: var(--slate); padding: 22px">
      <svg role="img" aria-label="{{ alt }}" viewBox="0 0 480 300" style="display: block; width: 100%; height: auto">
        <defs><clipPath id="fwClip"><rect x="0" y="0" width="{{ cx }}" height="300"/></clipPath></defs>
        <rect width="480" height="300" rx="14" fill="{{ dirty }}"/>
        <g fill="#000" opacity=".18"><circle cx="70" cy="80" r="26"/><circle cx="200" cy="200" r="34"/><circle cx="330" cy="90" r="22"/><circle cx="410" cy="220" r="30"/><path d="M40 250 q60 -30 120 0" stroke="#000" stroke-width="10" fill="none"/></g>
        <g clip-path="url(#fwClip)"><rect width="480" height="300" rx="14" fill="{{ clean }}"/><path d="{{ lines }}" stroke="#fff" stroke-width="3" opacity=".5" fill="none"/></g>
        <rect x="{{ bar }}" y="0" width="6" height="300" fill="#58B7EC"/>
        <text x="20" y="284" fill="#fff" font-family="Outfit, sans-serif" font-weight="700" font-size="18">After</text><text x="400" y="284" fill="#fff" font-family="Outfit, sans-serif" font-weight="700" font-size="18">Before</text>
      </svg>
      <p style="margin: 14px 4px 0; color: var(--white); font-size: 17px"><strong>{{ name }}</strong> · {{ note }}</p>
    </div>
  </section>

  <section id="services" style="background: #E7EFF5">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
      <h2 class="fw-d" style="margin: 0 0 34px; font-size: clamp(52px, 6.4vw, 92px); line-height: .9">What we wash</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 14px">
        <article style="padding: 26px; border-radius: 18px; background: #fff; display: flex; flex-direction: column; gap: 8px"><h3 style="margin: 0; font-size: 22px">House washing</h3><p style="margin: 0; line-height: 1.6; color: #4A5A68">Siding and exteriors brought back to bright.</p></article>
        <article style="padding: 26px; border-radius: 18px; background: #fff; display: flex; flex-direction: column; gap: 8px"><h3 style="margin: 0; font-size: 22px">Driveways &amp; concrete</h3><p style="margin: 0; line-height: 1.6; color: #4A5A68">Grime and oil spots lifted off.</p></article>
        <article style="padding: 26px; border-radius: 18px; background: #fff; display: flex; flex-direction: column; gap: 8px"><h3 style="margin: 0; font-size: 22px">Gutters</h3><p style="margin: 0; line-height: 1.6; color: #4A5A68">Cleared and cleaned before the snow comes.</p></article>
        <article style="padding: 26px; border-radius: 18px; background: #fff; display: flex; flex-direction: column; gap: 8px"><h3 style="margin: 0; font-size: 22px">Garages &amp; shops</h3><p style="margin: 0; line-height: 1.6; color: #4A5A68">Floors and walls washed down.</p></article>
        <article style="padding: 26px; border-radius: 18px; background: var(--deep); color: #fff; display: flex; flex-direction: column; gap: 8px"><h3 style="margin: 0; font-size: 22px">Dealerships &amp; fleets</h3><p style="margin: 0; line-height: 1.6; color: #DCEBF6">Commercial lots and fleet vehicles kept presentable.</p></article>
      </div>
    </div>
  </section>

  <section id="reviews" style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 34px">
      <h2 class="fw-d" style="margin: 0; font-size: clamp(52px, 6.4vw, 92px); line-height: .9">Neighbors say</h2>
      <p style="margin: 0; font-weight: 700; font-size: 18px; color: var(--deep)">5.0 ★ · 79 Google reviews</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">
      <figure style="margin: 0; padding: 28px; border-radius: 20px; background: var(--slate); color: var(--white); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 600">“The price was more than fair and he was very professional.”</blockquote><figcaption style="color: var(--sky); font-weight: 700">Google review</figcaption></figure>
      <figure style="margin: 0; padding: 28px; border-radius: 20px; background: var(--sky); color: var(--slate); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 600">“Dominic cleaned my gutters and did a wonderful job.”</blockquote><figcaption style="font-weight: 700">Google review</figcaption></figure>
      <figure style="margin: 0; padding: 28px; border-radius: 20px; background: var(--wheat); color: var(--slate); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 21px; line-height: 1.45; font-weight: 600">“Stand up guy and really appreciate him.”</blockquote><figcaption style="font-weight: 700">Google review</figcaption></figure>
    </div>
  </section>

  <section id="quote" style="background: var(--slate); color: var(--white)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 88px 24px 110px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 class="fw-d" style="margin: 0; font-size: clamp(52px, 6.4vw, 92px); line-height: .9">Free quote</h2>
        <p style="margin: 0; font-size: 19px; line-height: 1.6">Serving Billings, Montana</p>
        <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #C6D3DD">Open every day · 6 am – 9 pm</p>
        <p style="margin: 0; font-size: 28px; font-weight: 800"><a href="tel:+14066970192" style="color: var(--sky)">406-697-0192</a></p>
        <p style="margin: 0; color: #C6D3DD">Faithfulpressurewash@gmail.com</p>
      </div>
      <form aria-label="Request a free quote" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; padding: 26px; border-radius: 22px; background: var(--rock)">
        <label style="display: grid; gap: 8px; font-weight: 700">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #4B5D6C; border-radius: 12px; background: var(--slate); color: var(--white); font: 400 16px Outfit, sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 700">Phone<input type="tel" style="min-height: 52px; padding: 0 14px; border: 2px solid #4B5D6C; border-radius: 12px; background: var(--slate); color: var(--white); font: 400 16px Outfit, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">What needs washing?<select style="min-height: 52px; padding: 0 14px; border: 2px solid #4B5D6C; border-radius: 12px; background: var(--slate); color: var(--white); font: 400 16px Outfit, sans-serif"><option>House</option><option>Driveway or concrete</option><option>Gutters</option><option>Garage or shop</option><option>Business or fleet</option></select></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">Address or area<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #4B5D6C; border-radius: 12px; background: var(--slate); color: var(--white); font: 400 16px Outfit, sans-serif"></label>
        <button type="button" class="fw-btn" style="grid-column: 1 / -1; background: var(--sky); color: var(--slate)">Send my quote request</button>
      </form>
    </div>
  </section>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Faithful Pressure Wash. Not the official Faithful Pressure Wash website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { p: 55, i: 0 }; }
  renderVals() {
    var self = this;
    var s = [
      { name: "Driveway", note: "Concrete, oil spots and tire marks", dirty: "#7B6A55", clean: "#D9E3EA", lines: "M0 100 H480 M0 200 H480 M160 0 V300 M320 0 V300" },
      { name: "Siding", note: "Mildew and road dust off the walls", dirty: "#6F7A62", clean: "#F2F6F9", lines: "M0 40 H480 M0 80 H480 M0 120 H480 M0 160 H480 M0 200 H480 M0 240 H480" },
      { name: "Shop floor", note: "Grease and tracked-in dirt", dirty: "#4E4A44", clean: "#BFC9D1", lines: "M0 150 H480 M240 0 V300" },
      { name: "Fleet truck", note: "Road grime off the paint", dirty: "#6A5E52", clean: "#E7EEF3", lines: "M0 120 H480 M0 180 H480" }
    ];
    var c = s[this.state.i], p = this.state.p, x = Math.round(480 * p / 100);
    return {
      pct: p, cx: x, bar: Math.max(0, x - 3), dirty: c.dirty, clean: c.clean, lines: c.lines, name: c.name, note: c.note,
      slide: function (e) { self.setState({ p: +e.target.value }); },
      surfs: s.map(function (v, i) { var on = i === self.state.i; return { name: v.name, on: on ? "true" : "false", pick: function () { self.setState({ i: i }); }, style: on ? "background:#1679B8;color:#fff" : "background:#fff;color:#1D2A35;box-shadow:inset 0 0 0 2px #C9D6E0" }; }),
      alt: c.name + " shown " + p + " percent cleaned"
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
