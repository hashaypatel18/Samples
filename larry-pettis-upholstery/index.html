<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Larry Pettis Upholstery</title>
<meta name="description" content="A sample homepage design made for Larry Pettis Upholstery by Hashay Patel. Not the official Larry Pettis Upholstery website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500..900&amp;family=Work+Sans:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#1F2A2E}
*{box-sizing:border-box}
.lp{--pine:#1F2A2E;--teal:#2C4A4F;--wine:#7A2236;--brass:#D6A43A;--paper:#F5F1E8;--thread:#E9D7B0;font-family:'Work Sans',system-ui,sans-serif;color:var(--paper);background:var(--pine)}
.lp-d{font-family:'Playfair Display',serif;font-weight:800;letter-spacing:-.01em}
@keyframes lpSwing{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes lpStitch{to{stroke-dashoffset:-40}}
@keyframes lpFade{0%,100%{opacity:.4}50%{opacity:1}}
.lp-swatch{transform-box:fill-box;transform-origin:50% 0;animation:lpSwing 3.6s ease-in-out infinite}
.lp-swatch2{animation-delay:-1.2s}.lp-swatch3{animation-delay:-2.4s}
.lp-stitch{animation:lpStitch 2s linear infinite}
.lp-glint{animation:lpFade 3s ease-in-out infinite}
.lp-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:4px;font:600 17px 'Work Sans',sans-serif;text-decoration:none;border:0;cursor:pointer}
.lp-btn:focus-visible,.lp-sw:focus-visible,.lp-nav a:focus-visible{outline:3px solid var(--brass);outline-offset:3px}
.lp-sw{width:100%;min-height:96px;border-radius:6px;cursor:pointer;display:flex;align-items:flex-end;padding:10px;font:600 14px 'Work Sans',sans-serif}
.lp-nav a{color:var(--paper);text-decoration:none;font-weight:500;opacity:.85}
.lp-nav a:hover{opacity:1;color:var(--brass)}
@media (max-width:820px){.lp-nav{display:none !important}}
@media (max-width:600px){.lp-tag{display:none}}
@media (prefers-reduced-motion:reduce){.lp-swatch,.lp-stitch,.lp-glint{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="lp">
  <header style="max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" class="lp-d" style="font-size: 26px; color: var(--paper); text-decoration: none; white-space: nowrap">Larry Pettis<span class="lp-tag" style="font-family: 'Work Sans', sans-serif; font-size: 14px; font-weight: 500; margin-left: 10px; color: var(--brass)">Upholstery · Dothan, AL</span></a>
    <nav class="lp-nav" aria-label="Main" style="display: flex; gap: 28px"><a href="#fabric">Try a fabric</a><a href="#work">What we do</a><a href="#reviews">Reviews</a><a href="#visit">Visit</a></nav>
    <a class="lp-btn" href="tel:+13347976097" style="min-height: 46px; padding: 0 18px; background: var(--brass); color: var(--pine); white-space: nowrap">334-797-6097</a>
  </header>

  <section id="top" style="position: relative; overflow: hidden">
    <div style="max-width: 1280px; margin: 0 auto; padding: 44px 24px 84px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <p style="margin: 0; align-self: flex-start; padding: 8px 14px; border-radius: 4px; border: 1px solid #3E5A5F; font-weight: 600; font-size: 15px"><span style="color: var(--brass)">★ 4.8</span> from 35 Google reviews</p>
        <h1 class="lp-d" style="margin: 0; font-size: clamp(52px, 7.6vw, 104px); line-height: .98">Good furniture deserves a second life.</h1>
        <p style="margin: 0; font-size: 20px; line-height: 1.6; max-width: 540px; color: #CFD8D6">Over 30 years of furniture upholstery in Dothan. Chairs, barstools and more, re-covered from the latest fabric samples in the shop.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="lp-btn" href="#fabric" style="background: var(--brass); color: var(--pine)">Try a fabric</a>
          <a class="lp-btn" href="#visit" style="background: transparent; color: var(--paper); box-shadow: inset 0 0 0 2px #4A6267">Stop in or call</a>
        </div>
      </div>
      <svg role="img" aria-label="Illustration of a wingback armchair with fabric swatches swinging beside it and a line of stitching being sewn" viewBox="0 0 560 440" style="display: block; width: 100%; height: auto">
        <rect x="30" y="30" width="500" height="380" rx="8" fill="#2C4A4F"/>
        <g fill="none" stroke="#3E5A5F" stroke-width="2"><path d="M30 120H530M30 210H530M30 300H530"/></g>
        <g class="lp-swatch"><path d="M430 60 V96" stroke="#E9D7B0" stroke-width="3"/><rect x="404" y="96" width="52" height="64" rx="3" fill="#7A2236"/><path d="M404 150 h52" stroke="#E9D7B0" stroke-dasharray="4 4" stroke-width="2"/></g>
        <g class="lp-swatch lp-swatch2"><path d="M480 60 V110" stroke="#E9D7B0" stroke-width="3"/><rect x="454" y="110" width="52" height="64" rx="3" fill="#D6A43A"/><path d="M454 164 h52" stroke="#1F2A2E" stroke-dasharray="4 4" stroke-width="2"/></g>
        <g class="lp-swatch lp-swatch3"><path d="M380 60 V120" stroke="#E9D7B0" stroke-width="3"/><rect x="354" y="120" width="52" height="64" rx="3" fill="#8DB3A8"/><path d="M354 174 h52" stroke="#1F2A2E" stroke-dasharray="4 4" stroke-width="2"/></g>
        <path d="M60 64 H530" stroke="#E9D7B0" stroke-width="4"/>
        <ellipse cx="200" cy="378" rx="150" ry="16" fill="#16201F" opacity=".5"/>
        <path d="M96 150 Q90 96 140 86 H262 Q312 96 306 150 L300 260 H102Z" fill="#7A2236"/>
        <path d="M76 190 Q60 168 82 150 Q104 140 110 170 L112 300 H80Z" fill="#661B2C"/><path d="M326 190 Q342 168 320 150 Q298 140 292 170 L290 300 H322Z" fill="#661B2C"/>
        <path d="M100 250 Q200 236 302 250 L306 310 H96Z" fill="#8E2A41"/>
        <path class="lp-stitch" d="M112 120 Q200 106 290 120" fill="none" stroke="#E9D7B0" stroke-width="3" stroke-dasharray="8 6"/>
        <path d="M100 296 Q200 286 302 296" fill="none" stroke="#E9D7B0" stroke-width="3" stroke-dasharray="8 6" opacity=".7"/>
        <rect x="92" y="310" width="218" height="18" rx="3" fill="#4A2A18"/>
        <path d="M106 328 l-8 46 h12 l10 -46Z M296 328 l8 46 h-12 l-10 -46Z" fill="#4A2A18"/>
        <circle class="lp-glint" cx="250" cy="130" r="5" fill="#D6A43A"/>
      </svg>
    </div>
  </section>

  <section id="fabric" style="background: var(--paper); color: var(--pine)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <h2 class="lp-d" style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: 1.02">See your chair in a new fabric</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #45514F; max-width: 470px">Tap a swatch to re-cover the chair. It's only a preview. Come by to feel the real fabric samples in the shop.</p>
        <div role="group" aria-label="Fabric swatches" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px">
          <sc-for list="{{ fabs }}" as="f" hint-placeholder-count="6"><button type="button" class="lp-sw" aria-pressed="{{ f.on }}" onClick="{{ f.pick }}" style="{{ f.style }}"><span style="background: rgba(255,255,255,.88); color: #1F2A2E; padding: 3px 8px; border-radius: 3px">{{ f.name }}</span></button></sc-for>
        </div>
      </div>
      <div style="border-radius: 8px; background: var(--teal); padding: 28px">
        <svg role="img" aria-label="{{ alt }}" viewBox="0 0 420 340" style="display: block; width: 100%; height: auto">
          <defs><pattern id="lpPat" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="{{ c1 }}"/><path d="{{ pat }}" stroke="{{ c2 }}" stroke-width="3" fill="none"/></pattern></defs>
          <ellipse cx="210" cy="316" rx="150" ry="14" fill="#16201F" opacity=".4"/>
          <path d="M100 110 Q94 50 150 40 H270 Q326 50 320 110 L314 220 H106Z" fill="url(#lpPat)"/>
          <path d="M78 150 Q62 126 86 108 Q110 98 116 130 L118 262 H84Z" fill="url(#lpPat)"/><path d="M342 150 Q358 126 334 108 Q310 98 304 130 L302 262 H336Z" fill="url(#lpPat)"/>
          <path d="M104 210 Q210 196 316 210 L320 268 H100Z" fill="url(#lpPat)"/><path d="M104 210 Q210 196 316 210 L320 268 H100Z" fill="#000" opacity=".12"/>
          <path d="M116 80 Q210 66 304 80 M104 262 Q210 252 316 262" fill="none" stroke="#E9D7B0" stroke-width="3" stroke-dasharray="8 6"/>
          <rect x="96" y="270" width="228" height="16" rx="3" fill="#4A2A18"/>
          <path d="M110 286 l-8 30 h12 l10 -30Z M310 286 l8 30 h-12 l-10 -30Z" fill="#4A2A18"/>
        </svg>
        <p style="margin: 16px 0 0; color: var(--paper); font-weight: 600; font-size: 18px">{{ name }} <span style="font-weight: 400; opacity: .75">· {{ note }}</span></p>
      </div>
    </div>
  </section>

  <section id="work" style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
    <h2 class="lp-d" style="margin: 0 0 34px; font-size: clamp(40px, 5vw, 66px); line-height: 1.02">What comes through the door</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px">
      <article style="padding: 28px; border-radius: 6px; background: var(--teal); display: flex; flex-direction: column; gap: 10px"><span class="lp-d" style="font-size: 40px; color: var(--brass)">01</span><h3 style="margin: 0; font-size: 22px">Furniture upholstery</h3><p style="margin: 0; line-height: 1.6; color: #CFD8D6">Re-upholstery for the pieces you'd rather keep than replace.</p></article>
      <article style="padding: 28px; border-radius: 6px; background: var(--teal); display: flex; flex-direction: column; gap: 10px"><span class="lp-d" style="font-size: 40px; color: var(--brass)">02</span><h3 style="margin: 0; font-size: 22px">Barstools</h3><p style="margin: 0; line-height: 1.6; color: #CFD8D6">Worn seats re-covered so a full set looks like new again.</p></article>
      <article style="padding: 28px; border-radius: 6px; background: var(--teal); display: flex; flex-direction: column; gap: 10px"><span class="lp-d" style="font-size: 40px; color: var(--brass)">03</span><h3 style="margin: 0; font-size: 22px">Chair repair</h3><p style="margin: 0; line-height: 1.6; color: #CFD8D6">Torn or tired chairs repaired and back in use.</p></article>
      <article style="padding: 28px; border-radius: 6px; background: var(--wine); display: flex; flex-direction: column; gap: 10px"><span class="lp-d" style="font-size: 40px; color: var(--brass)">30+</span><h3 style="margin: 0; font-size: 22px">Years of experience</h3><p style="margin: 0; line-height: 1.6; color: #F0D9DE">With the latest fabric samples to choose from in the shop.</p></article>
    </div>
  </section>

  <section id="reviews" style="background: var(--wine)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 34px">
        <h2 class="lp-d" style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: 1.02">In customers' words</h2>
        <p style="margin: 0; font-weight: 600; font-size: 18px; color: var(--thread)">4.8 ★ · 35 Google reviews</p>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">
        <figure style="margin: 0; padding: 30px; border-radius: 6px; background: var(--paper); color: var(--pine); display: flex; flex-direction: column; gap: 14px"><blockquote class="lp-d" style="margin: 0; font-size: 22px; line-height: 1.4; font-weight: 600">“Great work, quick turnaround, good communication and reasonably priced.”</blockquote><figcaption style="color: var(--wine); font-weight: 600">Google review</figcaption></figure>
        <figure style="margin: 0; padding: 30px; border-radius: 6px; background: var(--paper); color: var(--pine); display: flex; flex-direction: column; gap: 14px"><blockquote class="lp-d" style="margin: 0; font-size: 22px; line-height: 1.4; font-weight: 600">“I had 4 barstools reupholstered &amp; they are like new again. Larry did a fantastic job.”</blockquote><figcaption style="color: var(--wine); font-weight: 600">Google review</figcaption></figure>
        <figure style="margin: 0; padding: 30px; border-radius: 6px; background: var(--paper); color: var(--pine); display: flex; flex-direction: column; gap: 14px"><blockquote class="lp-d" style="margin: 0; font-size: 22px; line-height: 1.4; font-weight: 600">“This was the best business experience I’ve had in long time!”</blockquote><figcaption style="color: var(--wine); font-weight: 600">Google review</figcaption></figure>
      </div>
    </div>
  </section>

  <section id="visit" style="background: var(--pine)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 88px 24px 110px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 class="lp-d" style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: 1.02">Call or stop in</h2>
        <p style="margin: 0; font-size: 19px; line-height: 1.6">2060 Trawick Road<br>Dothan, AL 36305</p>
        <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #CFD8D6">Monday – Thursday · 8 am – 5 pm</p>
        <p style="margin: 0; font-size: 28px; font-weight: 700"><a href="tel:+13347976097" style="color: var(--brass)">334-797-6097</a></p>
      </div>
      <form aria-label="Ask for a quote" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; padding: 26px; border-radius: 8px; background: var(--teal)">
        <label style="display: grid; gap: 8px; font-weight: 600">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #4A6267; border-radius: 4px; background: var(--pine); color: var(--paper); font: 400 16px 'Work Sans', sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 600">Phone<input type="tel" style="min-height: 52px; padding: 0 14px; border: 2px solid #4A6267; border-radius: 4px; background: var(--pine); color: var(--paper); font: 400 16px 'Work Sans', sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">What needs re-covering?<select style="min-height: 52px; padding: 0 14px; border: 2px solid #4A6267; border-radius: 4px; background: var(--pine); color: var(--paper); font: 400 16px 'Work Sans', sans-serif"><option>Chair</option><option>Sofa</option><option>Barstools</option><option>Something else</option></select></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">Tell us about it<textarea rows="3" style="padding: 12px 14px; border: 2px solid #4A6267; border-radius: 4px; background: var(--pine); color: var(--paper); font: 400 16px 'Work Sans', sans-serif; resize: vertical"></textarea></label>
        <button type="button" class="lp-btn" style="grid-column: 1 / -1; background: var(--brass); color: var(--pine)">Ask for a quote</button>
      </form>
    </div>
  </section>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Larry Pettis Upholstery. Not the official Larry Pettis Upholstery website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 0 }; }
  renderVals() {
    var self = this;
    var f = [
      { name: "Wine velvet", note: "Rich and classic", c1: "#7A2236", c2: "#8E2A41", pat: "M0 16 L16 0" },
      { name: "Gold linen", note: "Warm and bright", c1: "#D6A43A", c2: "#C79530", pat: "M0 8 H16" },
      { name: "Sage weave", note: "Soft and calm", c1: "#8DB3A8", c2: "#7AA195", pat: "M0 8 H16 M8 0 V16" },
      { name: "Navy check", note: "Smart and hard-wearing", c1: "#2B3A5C", c2: "#E9D7B0", pat: "M0 8 H16 M8 0 V16" },
      { name: "Oatmeal tweed", note: "Neutral, goes anywhere", c1: "#CDBE9E", c2: "#B3A27F", pat: "M0 0 L16 16 M16 0 L0 16" },
      { name: "Charcoal leather", note: "Wipe-clean and tough", c1: "#33393B", c2: "#3D4446", pat: "M0 4 Q8 0 16 4" }
    ];
    var c = f[this.state.i];
    return {
      fabs: f.map(function (x, i) { var on = i === self.state.i; return { name: x.name, on: on ? "true" : "false", pick: function () { self.setState({ i: i }); }, style: "background:" + x.c1 + ";border:" + (on ? "4px solid #1F2A2E" : "4px solid transparent") }; }),
      c1: c.c1, c2: c.c2, pat: c.pat, name: c.name, note: c.note,
      alt: "Armchair preview in " + c.name
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
