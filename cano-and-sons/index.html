<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Cano &amp; Sons</title>
<meta name="description" content="A sample homepage design made for Cano &amp; Sons by Hashay Patel. Not the official Cano &amp; Sons website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500;700;800;900&amp;family=Archivo:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0C1730}
*{box-sizing:border-box}
.cs{--night:#0C1730;--dusk:#1B2F57;--amber:#FFB21A;--red:#E5432D;--line:#F3EFE4;--fog:#AEB9CF;--rubber:#22252B;font-family:Archivo,system-ui,sans-serif;color:var(--line);background:var(--night)}
.cs a{color:inherit}
.cs-disp{font-family:'Big Shoulders Display',Impact,sans-serif;font-weight:800;letter-spacing:.005em;line-height:.9}
@keyframes csDash{to{stroke-dashoffset:-120}}
@keyframes csBeacon{0%,100%{opacity:1}50%{opacity:.15}}
@keyframes csSweep{0%{transform:rotate(-30deg);opacity:.0}20%{opacity:.55}100%{transform:rotate(30deg);opacity:0}}
@keyframes csSpin{to{transform:rotate(360deg)}}
@keyframes csBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes csMarq{to{transform:translateX(-50%)}}
@keyframes csPulse{0%{box-shadow:0 0 0 0 rgba(255,178,26,.55)}100%{box-shadow:0 0 0 18px rgba(255,178,26,0)}}
.cs-dash{stroke-dasharray:40 80;animation:csDash 1.1s linear infinite}
.cs-beacon{animation:csBeacon .7s steps(1) infinite}
.cs-beacon2{animation:csBeacon .7s steps(1) infinite;animation-delay:.35s}
.cs-sweep{transform-origin:50% 100%;transform-box:fill-box;animation:csSweep 1.4s ease-in-out infinite}
.cs-wheel{transform-box:fill-box;transform-origin:center;animation:csSpin .9s linear infinite}
.cs-truck{animation:csBob .5s ease-in-out infinite}
.cs-marq{display:flex;width:max-content;animation:csMarq 38s linear infinite}
.cs-call{display:inline-flex;align-items:center;gap:14px;min-height:64px;padding:0 28px 0 12px;border-radius:999px;background:var(--amber);color:#1A1406 !important;text-decoration:none;font-weight:700;font-size:18px;animation:csPulse 1.8s ease-out infinite}
.cs-call:hover{background:#FFC547}
.cs-call:focus-visible,.cs-chip:focus-visible,.cs-ghost:focus-visible{outline:3px solid #fff;outline-offset:3px}
.cs-ghost{display:inline-flex;align-items:center;min-height:64px;padding:0 26px;border-radius:999px;border:2px solid rgba(243,239,228,.4);color:var(--line);text-decoration:none;font-weight:600}
.cs-ghost:hover{border-color:var(--line)}
.cs-chip{min-height:48px;padding:0 18px;border-radius:14px;cursor:pointer;font:600 15px Archivo,sans-serif;text-align:left}
.cs-nav a{text-decoration:none;font-weight:600;font-size:15px;color:var(--fog)}
.cs-nav a:hover{color:var(--line)}
@media (max-width:820px){.cs-nav{display:none !important}.cs-hide-sm{display:none !important}}
@media (prefers-reduced-motion:reduce){.cs-dash,.cs-beacon,.cs-beacon2,.cs-sweep,.cs-wheel,.cs-truck,.cs-marq,.cs-call{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="cs">

  <section id="top" style="position: relative; overflow: hidden; background: radial-gradient(120% 90% at 70% 0%, #2A4677 0%, #14244A 45%, #0C1730 75%)">
  <header style="position: relative; z-index: 3; max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px">
    <a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none">
      <svg aria-hidden="true" width="48" height="48" viewBox="0 0 48 48"><circle cx="24" cy="24" r="21" fill="#22252B" stroke="#FFB21A" stroke-width="3"/><circle cx="24" cy="24" r="9" fill="#0C1730" stroke="#AEB9CF" stroke-width="3"/><g stroke="#FFB21A" stroke-width="3" stroke-linecap="round"><path d="M24 4v6M24 38v6M4 24h6M38 24h6M9.9 9.9l4.2 4.2M33.9 33.9l4.2 4.2M9.9 38.1l4.2-4.2M33.9 14.1l4.2-4.2"/></g></svg>
      <span style="display: flex; flex-direction: column; gap: 3px">
        <span class="cs-disp" style="font-size: 30px">Cano &amp; Sons</span>
        <span style="font-size: 13px; color: var(--fog)">24 hr shop &amp; road service · Victoria, TX</span>
      </span>
    </a>
    <nav class="cs-nav" aria-label="Main" style="display: flex; gap: 28px">
      <a href="#help">Roadside help</a>
      <a href="#shop">Tire shop</a>
      <a href="#fleet">What we fix</a>
      <a href="#find">Find us</a>
    </nav>
    <a href="tel:+13612208565" class="cs-hide-sm" style="display: flex; align-items: center; gap: 10px; text-decoration: none; font-weight: 700">
      <span aria-hidden="true" class="cs-beacon" style="width: 10px; height: 10px; border-radius: 50%; background: #3BD16F; box-shadow: 0 0 12px #3BD16F"></span>
      Open right now · (361) 220-8565
    </a>
  </header>
    <svg aria-hidden="true" viewBox="0 0 1440 300" preserveAspectRatio="xMaxYMin slice" style="position: absolute; inset: 0 0 auto 0; width: 100%; height: 300px; opacity: .8">
      <g fill="#F3EFE4"><circle cx="120" cy="60" r="1.6"/><circle cx="260" cy="130" r="1.2"/><circle cx="420" cy="40" r="1.8"/><circle cx="610" cy="100" r="1.1"/><circle cx="780" cy="30" r="1.5"/><circle cx="930" cy="140" r="1.2"/><circle cx="1080" cy="70" r="1.7"/><circle cx="1230" cy="120" r="1.2"/><circle cx="1360" cy="50" r="1.5"/><circle cx="340" cy="210" r="1"/><circle cx="1000" cy="230" r="1"/></g>
      <circle cx="1210" cy="110" r="44" fill="#F3EFE4" opacity=".92"/><circle cx="1228" cy="98" r="44" fill="#1E3460"/>
    </svg>

    <div style="position: relative; z-index: 2; max-width: 1280px; margin: 0 auto; padding: 10px 24px 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 26px; padding-top: 20px">
        <p style="margin: 0; display: inline-flex; align-self: flex-start; align-items: center; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(255,178,26,.14); color: var(--amber); font-weight: 600; font-size: 14px">
          <span aria-hidden="true">★ 4.7</span> from 383 Google reviews
        </p>
        <h1 class="cs-disp" style="margin: 0; font-size: clamp(60px, 8vw, 112px); text-transform: none">Blowout at 3&nbsp;a.m.?<br><span style="color: var(--amber)">We're up.</span></h1>
        <p style="margin: 0; font-size: 19px; line-height: 1.65; color: #D5DCEA; max-width: 520px">Tire repair, new and used tires, and breakdown help for cars, pickups, 18-wheelers, buses, RVs and farm equipment. Day or night, we come to you and get you rolling.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 14px">
          <a class="cs-call" href="tel:+13612208565">
            <span aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #1A1406; display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="#FFB21A"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></span>
            Call (361) 220-8565
          </a>
          <a class="cs-ghost" href="#shop">Visit the tire shop</a>
        </div>
      </div>

      <div id="help" style="position: relative; align-self: end; background: rgba(12,23,48,.72); backdrop-filter: blur(10px); border: 1px solid rgba(174,185,207,.25); border-radius: 26px; padding: 24px; box-shadow: 0 40px 80px -30px rgba(0,0,0,.6)">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px">
          <h2 style="margin: 0; font-size: 20px; font-weight: 700">What's going on?</h2>
          <span style="font-size: 13px; color: #3BD16F; display: flex; align-items: center; gap: 8px"><span aria-hidden="true" class="cs-beacon" style="width: 8px; height: 8px; border-radius: 50%; background: #3BD16F"></span>Open 24/7</span>
        </div>
        <div role="tablist" aria-label="Type of problem" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px">
          <sc-for list="{{ probs }}" as="p" hint-placeholder-count="4">
            <button type="button" role="tab" class="cs-chip" aria-selected="{{ p.sel }}" onClick="{{ p.pick }}" style="{{ p.style }}">{{ p.label }}</button>
          </sc-for>
        </div>
        <div style="margin-top: 18px; padding: 18px; border-radius: 18px; background: rgba(255,178,26,.08); border: 1px dashed rgba(255,178,26,.45)">
          <p style="margin: 0 0 10px; font-weight: 700; color: var(--amber)">{{ cur.title }}</p>
          <ul style="margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; color: #D5DCEA">
            <sc-for list="{{ cur.items }}" as="i" hint-placeholder-count="3">
              <li style="display: flex; gap: 10px"><span aria-hidden="true" style="color: var(--amber)">●</span>{{ i.t }}</li>
            </sc-for>
          </ul>
        </div>
        <a href="tel:+13612208565" style="margin-top: 16px; display: flex; justify-content: center; align-items: center; min-height: 52px; border-radius: 14px; background: var(--line); color: var(--night); text-decoration: none; font-weight: 700">Call now and tell us where you are</a>
      </div>
    </div>

    <svg role="img" aria-label="Cano and Sons service truck with amber lights driving down a night highway" viewBox="0 0 1440 360" style="position: relative; z-index: 1; display: block; width: 100%; height: auto; margin-top: -110px">
      <defs>
        <linearGradient id="csRoad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A1E26"/><stop offset="1" stop-color="#2B2F37"/></linearGradient>
        <radialGradient id="csGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFB21A" stop-opacity=".55"/><stop offset="1" stop-color="#FFB21A" stop-opacity="0"/></radialGradient>
        <linearGradient id="csBeam" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFF4CF" stop-opacity=".55"/><stop offset="1" stop-color="#FFF4CF" stop-opacity="0"/></linearGradient>
      </defs>
      <path d="M0 150 L380 120 L520 128 L760 96 L980 118 L1180 100 L1440 128 L1440 200 L0 200Z" fill="#14213F"/>
      <rect y="190" width="1440" height="170" fill="url(#csRoad)"/>
      <line x1="0" y1="196" x2="1440" y2="196" stroke="#FFB21A" stroke-width="4" opacity=".75"/>
      <line class="cs-dash" x1="0" y1="282" x2="1440" y2="282" stroke="#F3EFE4" stroke-width="6"/>
      <line x1="0" y1="352" x2="1440" y2="352" stroke="#F3EFE4" stroke-width="4" opacity=".6"/>
      <g transform="translate(300 120)">
        <path d="M430 120 L880 70 L880 190 L430 140Z" fill="url(#csBeam)"/>
        <ellipse cx="210" cy="152" rx="250" ry="14" fill="#000" opacity=".35"/>
        <ellipse cx="170" cy="20" rx="80" ry="40" fill="url(#csGlow)"/>
        <g class="cs-truck">
          <rect x="0" y="42" width="270" height="80" rx="10" fill="#F3EFE4"/>
          <rect x="0" y="104" width="270" height="10" fill="#E5432D"/>
          <text x="22" y="76" font-family="Big Shoulders Display, Impact, sans-serif" font-weight="800" font-size="30" fill="#0C1730">CANO &amp; SONS</text>
          <text x="22" y="97" font-family="Archivo, sans-serif" font-weight="700" font-size="12" fill="#0C1730">24 HR ROAD SERVICE · 361-220-8565</text>
          <path d="M270 54 H350 Q372 54 384 76 L420 104 Q430 110 430 122 V128 H270Z" fill="#E5432D"/>
          <path d="M290 64 H346 Q360 64 368 78 L384 98 H290Z" fill="#9FC3E8"/>
          <rect x="414" y="108" width="16" height="10" rx="3" fill="#FFF4CF"/>
          <rect x="150" y="26" width="60" height="16" rx="6" fill="#22252B"/>
          <rect class="cs-beacon" x="154" y="28" width="24" height="12" rx="4" fill="#FFB21A"/>
          <rect class="cs-beacon2" x="182" y="28" width="24" height="12" rx="4" fill="#FFB21A"/>
          <g class="cs-wheel"><circle cx="70" cy="130" r="25" fill="#15171B"/><circle cx="70" cy="130" r="11" fill="#AEB9CF"/><rect x="66" y="107" width="8" height="46" fill="#15171B" opacity=".6"/></g>
          <g class="cs-wheel"><circle cx="352" cy="130" r="25" fill="#15171B"/><circle cx="352" cy="130" r="11" fill="#AEB9CF"/><rect x="348" y="107" width="8" height="46" fill="#15171B" opacity=".6"/></g>
        </g>
      </g>
      <g opacity=".5"><rect x="110" y="150" width="6" height="40" fill="#AEB9CF"/><rect x="88" y="128" width="50" height="26" rx="4" fill="#2F6B45"/><text x="113" y="146" text-anchor="middle" font-family="Archivo" font-weight="700" font-size="12" fill="#fff">US 59</text></g>
    </svg>
  </section>

  <div aria-hidden="true" style="background: var(--amber); color: #1A1406; overflow: hidden; padding: 16px 0">
    <div class="cs-marq cs-disp" style="font-size: 30px; gap: 40px; white-space: nowrap">
      <span>Flat tires</span><span>✦</span><span>Blowouts</span><span>✦</span><span>New &amp; used tires</span><span>✦</span><span>Gas &amp; diesel breakdowns</span><span>✦</span><span>Big rigs</span><span>✦</span><span>Buses &amp; RVs</span><span>✦</span><span>Tractor tires</span><span>✦</span><span>Truck parking</span><span>✦</span>
      <span>Flat tires</span><span>✦</span><span>Blowouts</span><span>✦</span><span>New &amp; used tires</span><span>✦</span><span>Gas &amp; diesel breakdowns</span><span>✦</span><span>Big rigs</span><span>✦</span><span>Buses &amp; RVs</span><span>✦</span><span>Tractor tires</span><span>✦</span><span>Truck parking</span><span>✦</span>
    </div>
  </div>

  <section id="shop" style="background: var(--line); color: var(--night)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 110px 24px 100px">
      <h2 class="cs-disp" style="margin: 0 0 14px; font-size: clamp(48px, 6vw, 84px)">Two ways we get you rolling</h2>
      <p style="margin: 0 0 44px; font-size: 18px; line-height: 1.6; max-width: 640px; color: #3A4660">Can't move? We drive out to you. Can make it in? Pull into the shop on Stolz St, where the tires are already on the rack.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 22px">
        <article style="position: relative; overflow: hidden; border-radius: 28px; padding: 36px; background: var(--night); color: var(--line); min-height: 360px; display: flex; flex-direction: column; gap: 16px">
          <svg aria-hidden="true" viewBox="0 0 200 200" style="position: absolute; right: -40px; bottom: -40px; width: 260px; opacity: .9"><circle cx="100" cy="100" r="90" fill="none" stroke="#FFB21A" stroke-width="2" stroke-dasharray="6 10"/><circle cx="100" cy="100" r="60" fill="none" stroke="#FFB21A" stroke-width="2" opacity=".6"/><circle cx="100" cy="100" r="30" fill="#FFB21A" opacity=".18"/><circle cx="100" cy="100" r="8" fill="#FFB21A"/></svg>
          <h3 class="cs-disp" style="margin: 0; font-size: 46px; color: var(--amber)">Road service</h3>
          <p style="margin: 0; font-size: 17px; line-height: 1.65; color: #D5DCEA; max-width: 380px">On the highway, in a field or in your driveway. Tire changes and repairs on site, plus help with gas and diesel breakdowns, any hour of any day.</p>
          <ul style="margin: auto 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; position: relative">
            <li style="padding: 8px 14px; border-radius: 999px; background: rgba(243,239,228,.1)">Commercial</li>
            <li style="padding: 8px 14px; border-radius: 999px; background: rgba(243,239,228,.1)">Residential</li>
            <li style="padding: 8px 14px; border-radius: 999px; background: rgba(243,239,228,.1)">Farm &amp; ranch</li>
          </ul>
        </article>
        <article style="position: relative; overflow: hidden; border-radius: 28px; padding: 36px; background: #FFB21A; color: #1A1406; min-height: 360px; display: flex; flex-direction: column; gap: 16px">
          <svg aria-hidden="true" viewBox="0 0 200 200" style="position: absolute; right: -30px; bottom: -30px; width: 250px"><g class="cs-wheel"><circle cx="100" cy="100" r="88" fill="#22252B"/><circle cx="100" cy="100" r="88" fill="none" stroke="#3A3E46" stroke-width="10" stroke-dasharray="10 8"/><circle cx="100" cy="100" r="46" fill="#AEB9CF"/><circle cx="100" cy="100" r="14" fill="#22252B"/><g fill="#22252B"><circle cx="100" cy="70" r="6"/><circle cx="130" cy="100" r="6"/><circle cx="100" cy="130" r="6"/><circle cx="70" cy="100" r="6"/></g></g></svg>
          <h3 class="cs-disp" style="margin: 0; font-size: 46px">The shop</h3>
          <p style="margin: 0; font-size: 17px; line-height: 1.65; max-width: 360px">New and used tires on site at 1805 Stolz St, fitted while you wait. Room for big trucks, with truck parking available.</p>
          <a href="https://maps.google.com/?q=1805+Stolz+St+Victoria+TX" style="margin-top: auto; align-self: flex-start; position: relative; display: inline-flex; align-items: center; min-height: 52px; padding: 0 22px; border-radius: 999px; background: #1A1406; color: #FFB21A; text-decoration: none; font-weight: 700">Get directions</a>
        </article>
      </div>
    </div>
  </section>

  <section id="fleet" style="background: #12224A">
    <div style="max-width: 1280px; margin: 0 auto; padding: 100px 24px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 20px; margin-bottom: 40px">
        <h2 class="cs-disp" style="margin: 0; font-size: clamp(46px, 5.6vw, 80px); max-width: 640px">If it rolls on rubber, call us</h2>
        <p style="margin: 0; color: var(--fog); max-width: 360px; line-height: 1.6">From a family pickup to a loaded semi or a tractor in the middle of a field.</p>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 14px">
        <sc-for list="{{ fleet }}" as="f" hint-placeholder-count="6">
          <li style="border-radius: 22px; padding: 22px; background: rgba(243,239,228,.05); border: 1px solid rgba(174,185,207,.18); display: flex; flex-direction: column; gap: 14px; min-height: 170px">
            <span aria-hidden="true" style="font-size: 38px">{{ f.icon }}</span>
            <span style="font-weight: 700; font-size: 18px">{{ f.name }}</span>
            <span style="color: var(--fog); font-size: 14px; line-height: 1.5">{{ f.note }}</span>
          </li>
        </sc-for>
      </ul>
    </div>
  </section>

  <section aria-label="Reviews" style="background: var(--night)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 100px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; gap: 22px; align-items: center">
        <span class="cs-disp" style="font-size: 160px; color: var(--amber); line-height: .8">4.7</span>
        <span style="display: flex; flex-direction: column; gap: 6px"><span style="color: var(--amber); font-size: 26px; letter-spacing: 3px">★★★★★</span><span style="color: var(--fog)">383 reviews on Google</span><span style="color: var(--fog)">Open 24 hours, 7 days a week</span></span>
      </div>
      <figure style="margin: 0; border-left: 4px solid var(--amber); padding-left: 28px">
        <blockquote class="cs-disp" style="margin: 0; font-size: clamp(34px, 3.6vw, 52px); font-weight: 700; line-height: 1.05">"If you need a mobile mechanic or a repair shop give him a call."</blockquote>
        <figcaption style="margin-top: 16px; color: var(--fog)">Google review</figcaption>
      </figure>
    </div>
  </section>

  <section id="find" style="background: var(--line); color: var(--night)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 90px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <h2 class="cs-disp" style="margin: 0; font-size: clamp(46px, 5.4vw, 76px)">1805 Stolz St<br>Victoria, TX 77901</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #3A4660">Open 24 hours, every day of the year. No appointment needed for the shop, and for road service just call and tell us where you are.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a href="tel:+13612208565" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border-radius: 999px; background: var(--night); color: var(--amber); text-decoration: none; font-weight: 700">Call (361) 220-8565</a>
          <a href="https://maps.google.com/?q=1805+Stolz+St+Victoria+TX" style="display: inline-flex; align-items: center; min-height: 56px; padding: 0 26px; border-radius: 999px; border: 2px solid var(--night); color: var(--night); text-decoration: none; font-weight: 700">Open in Maps</a>
        </div>
      </div>
      <svg role="img" aria-label="Map pin on Stolz Street in Victoria, Texas" viewBox="0 0 520 320" style="width: 100%; height: auto; border-radius: 28px; background: #DCD6C6">
        <g stroke="#F3EFE4" stroke-width="14" fill="none"><path d="M-10 90 H530"/><path d="M-10 230 H530"/><path d="M140 -10 V330"/><path d="M380 -10 V330"/></g>
        <path d="M-10 160 C120 150 220 190 530 150" stroke="#FFB21A" stroke-width="18" fill="none"/>
