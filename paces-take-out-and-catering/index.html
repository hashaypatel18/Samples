<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Pace&#x27;s Take Out &amp; Catering</title>
<meta name="description" content="A sample homepage design made for Pace&#x27;s Take Out &amp; Catering by Hashay Patel. Not the official Pace&#x27;s Take Out &amp; Catering website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF4DF}
*{box-sizing:border-box}
.pt{--cream:#FFF4DF;--tomato:#E23B24;--sauce:#A82414;--basil:#2F7D4A;--butter:#FFC93C;--ink:#2B1A12;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--cream)}
.pt-script{font-family:Shrikhand,cursive;font-weight:400;line-height:1}
.pt-check{background-image:repeating-conic-gradient(#E23B24 0 25%, #FFF4DF 0 50%);background-size:44px 44px}
@keyframes ptSteam{0%{transform:translateY(10px);opacity:0}40%{opacity:.8}100%{transform:translateY(-40px);opacity:0}}
@keyframes ptWob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes ptRoll{to{transform:translateX(-50%)}}
.pt-steam{animation:ptSteam 2.6s ease-out infinite}
.pt-wob{transform-box:fill-box;transform-origin:50% 100%;animation:ptWob 3s ease-in-out infinite}
.pt-roll{display:flex;width:max-content;animation:ptRoll 28s linear infinite}
.pt-btn{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 28px;border-radius:999px;font:700 17px 'DM Sans',sans-serif;text-decoration:none;border:0;cursor:pointer}
.pt-btn:focus-visible,.pt-g:focus-visible{outline:3px solid var(--basil);outline-offset:3px}
.pt-g{min-width:72px;min-height:56px;padding:0 18px;border-radius:999px;cursor:pointer;font:700 17px 'DM Sans',sans-serif}
.pt-nav a{color:var(--ink);text-decoration:none;font-weight:600}
.pt-nav a:hover{color:var(--tomato)}
@media (max-width:820px){.pt-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.pt-steam,.pt-wob,.pt-roll{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="pt">
  <div aria-hidden="true" class="pt-check" style="height: 22px"></div>
  <header style="max-width: 1280px; margin: 0 auto; padding: 18px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" style="text-decoration: none; color: var(--tomato); display: flex; align-items: baseline; gap: 10px">
      <span class="pt-script" style="font-size: 40px">Pace's</span>
      <span style="color: var(--ink); font-weight: 700; font-size: 14px">Take Out &amp; Catering · Brantford</span>
    </a>
    <nav class="pt-nav" aria-label="Main" style="display: flex; gap: 30px"><a href="#takeout">Take-out</a><a href="#catering">Catering</a><a href="#visit">Hours</a></nav>
    <a class="pt-btn" href="tel:+15197530060" style="min-height: 48px; background: var(--tomato); color: #fff">519-753-0060</a>
  </header>

  <section id="top" style="max-width: 1280px; margin: 0 auto; padding: 20px 24px 80px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 40px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 24px">
      <p style="margin: 0; align-self: flex-start; padding: 8px 16px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 2px #F6D9A8; font-weight: 700">★ 4.7 · 100 Google reviews</p>
      <h1 class="pt-script" style="margin: 0; font-size: clamp(50px, 6.2vw, 90px); color: var(--sauce)">Good food, good prices, family&#8209;run.</h1>
      <p style="margin: 0; font-size: 19px; line-height: 1.65; max-width: 520px">That's how Brantford describes Pace's. Homestyle take-out on Elgin Street on weekdays, and catering for your party on the weekend.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a class="pt-btn" href="tel:+15197530060" style="background: var(--tomato); color: #fff">Call in an order</a>
        <a class="pt-btn" href="#catering" style="background: var(--butter); color: var(--ink)">Plan your catering</a>
      </div>
    </div>
    <figure style="margin: 0; position: relative">
      <div aria-hidden="true" style="position: absolute; inset: 6% 6%; border-radius: 50%; background: var(--butter)"></div>
      <svg role="img" aria-label="A steaming take-out box of spaghetti and meatballs" viewBox="0 0 560 520" style="position: relative; display: block; width: 100%; height: auto">
        <g fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity=".9">
          <path class="pt-steam" d="M210 120 C190 90 230 70 210 40"/><path class="pt-steam" d="M280 110 C260 80 300 60 280 30" style="animation-delay:-.9s"/><path class="pt-steam" d="M350 120 C330 90 370 70 350 40" style="animation-delay:-1.7s"/>
        </g>
        <path d="M120 220 L440 220 L400 460 L160 460Z" fill="#fff" stroke="#2B1A12" stroke-width="5"/>
        <path d="M120 220 L180 140 L380 140 L440 220Z" fill="#FDEBD0" stroke="#2B1A12" stroke-width="5"/>
        <g fill="none" stroke="#F2C46B" stroke-width="7" stroke-linecap="round"><path d="M170 190 C220 150 260 220 300 170 C330 140 360 200 400 180"/><path d="M180 210 C230 180 270 230 320 195 C350 175 380 215 420 205"/><path d="M200 170 C240 150 280 190 330 160"/></g>
        <g fill="#C2412A" stroke="#2B1A12" stroke-width="3"><circle cx="230" cy="180" r="24"/><circle cx="300" cy="196" r="26"/><circle cx="360" cy="176" r="22"/></g>
        <path d="M190 200 C240 230 330 230 400 200" stroke="#E23B24" stroke-width="16" fill="none" stroke-linecap="round" opacity=".8"/>
        <g class="pt-wob"><path d="M330 150 C340 120 370 110 380 130 C370 150 350 160 330 150Z" fill="#2F7D4A"/></g>
        <rect x="196" y="300" width="168" height="80" rx="10" fill="#E23B24"/>
        <text x="280" y="352" text-anchor="middle" font-family="Shrikhand, cursive" font-size="40" fill="#FFF4DF">Pace's</text>
        <g transform="translate(450 330) rotate(18)"><rect x="-14" y="-90" width="10" height="150" rx="5" fill="#C9A26B"/><rect x="6" y="-90" width="10" height="150" rx="5" fill="#C9A26B"/></g>
      </svg>
      <figcaption style="position: absolute; left: 0; bottom: 30px; background: var(--basil); color: #fff; padding: 14px 20px; border-radius: 18px; transform: rotate(-4deg); font-weight: 700; max-width: 260px">"Excellent spaghetti and meatballs"<span style="display: block; font-weight: 500; opacity: .8; font-size: 14px">Google review</span></figcaption>
    </figure>
  </section>

  <div aria-hidden="true" style="background: var(--sauce); color: var(--cream); overflow: hidden; padding: 16px 0">
    <div class="pt-roll pt-script" style="gap: 40px; font-size: 28px; white-space: nowrap"><span>Take-out</span><span>✿</span><span>Catering</span><span>✿</span><span>Family-run</span><span>✿</span><span>Elgin Street</span><span>✿</span><span>Spaghetti &amp; meatballs</span><span>✿</span><span>Take-out</span><span>✿</span><span>Catering</span><span>✿</span><span>Family-run</span><span>✿</span><span>Elgin Street</span><span>✿</span><span>Spaghetti &amp; meatballs</span><span>✿</span></div>
  </div>

  <section id="takeout" style="max-width: 1280px; margin: 0 auto; padding: 100px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 360px), 1fr)); gap: 20px">
    <article style="grid-column: span 1; border-radius: 30px; padding: 36px; background: var(--tomato); color: #fff; display: flex; flex-direction: column; gap: 16px; min-height: 340px">
      <h2 class="pt-script" style="margin: 0; font-size: 50px">Weekday take-out</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.65">Call ahead and it'll be hot and packed when you walk in. Lunch for the office, dinner for the family.</p>
      <p style="margin: auto 0 0; font-size: 22px; font-weight: 700">Mon – Fri · 10 am – 5 pm</p>
    </article>
    <article style="border-radius: 30px; padding: 36px; background: #fff; display: flex; flex-direction: column; gap: 16px; min-height: 340px; box-shadow: inset 0 0 0 3px #F6D9A8">
      <span aria-hidden="true" style="font-size: 54px">🍝</span>
      <h3 class="pt-script" style="margin: 0; font-size: 40px; color: var(--sauce)">The one people rave about</h3>
      <p style="margin: 0; font-size: 18px; line-height: 1.65">Spaghetti and meatballs. Customers say they're sure the rest of the menu is just as good, so try that too.</p>
    </article>
    <article style="border-radius: 30px; padding: 36px; background: var(--basil); color: #fff; display: flex; flex-direction: column; gap: 16px; min-height: 340px">
      <span class="pt-script" style="font-size: 90px; color: var(--butter)">4.7</span>
      <p style="margin: 0; font-size: 20px; font-weight: 700">From 100 Google reviews</p>
      <p style="margin: 0; font-size: 17px; line-height: 1.6; opacity: .9">And 100% of Facebook reviewers recommend Pace's.</p>
    </article>
  </section>

  <section id="catering" class="pt-check" style="padding: 22px 0">
    <div style="background: var(--cream)">
      <div style="max-width: 1280px; margin: 0 auto; padding: 90px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 18px">
          <h2 class="pt-script" style="margin: 0; font-size: clamp(46px, 5.6vw, 78px); color: var(--sauce)">Catering for your crowd</h2>
          <p style="margin: 0; font-size: 18px; line-height: 1.65">Birthdays, showers, anniversaries and office parties. Pace's caters on weekends. Tell us how many are coming and we'll plan the food together.</p>
          <p style="margin: 6px 0 0; font-weight: 700">How many guests?</p>
          <div role="radiogroup" aria-label="Number of guests" style="display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{ guests }}" as="g" hint-placeholder-count="4">
              <button type="button" role="radio" class="pt-g" aria-checked="{{ g.sel }}" onClick="{{ g.pick }}" style="{{ g.style }}">{{ g.label }}</button>
            </sc-for>
          </div>
        </div>
        <div style="border-radius: 30px; background: #fff; padding: 30px; box-shadow: 0 30px 60px -40px rgba(168,36,20,.5); display: flex; flex-direction: column; gap: 18px">
          <p class="pt-script" style="margin: 0; font-size: 34px; color: var(--tomato)">{{ party.title }}</p>
          <div aria-hidden="true" style="display: flex; flex-wrap: wrap; gap: 6px; min-height: 96px; align-content: flex-start">
            <sc-for list="{{ party.dots }}" as="d" hint-placeholder-count="20"><span style="width: 22px; height: 22px; border-radius: 50%; background: {{ d.c }}"></span></sc-for>
          </div>
          <p style="margin: 0; font-size: 17px; line-height: 1.6">{{ party.note }}</p>
          <a class="pt-btn" href="tel:+15197530060" style="background: var(--sauce); color: #fff">Call to book a weekend</a>
        </div>
      </div>
    </div>
  </section>

  <section id="visit" style="max-width: 1280px; margin: 0 auto; padding: 100px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h2 class="pt-script" style="margin: 0; font-size: clamp(46px, 5.6vw, 78px); color: var(--sauce)">432 Elgin St</h2>
      <p style="margin: 0; font-size: 19px">Brantford, ON N3S 7P7</p>
      <dl style="margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 26px; font-size: 18px; max-width: 380px">
        <dt style="font-weight: 700">Mon – Fri</dt><dd style="margin: 0">Take-out, 10 am – 5 pm</dd>
        <dt style="font-weight: 700">Weekends</dt><dd style="margin: 0">Catering bookings</dd>
      </dl>
      <p style="margin: 8px 0 0; font-size: 24px; font-weight: 700"><a href="tel:+15197530060" style="color: var(--tomato)">519-753-0060</a></p>
      <p style="margin: 0">lmpace@rogers.com</p>
    </div>
    <svg role="img" aria-label="Storefront of Pace's take-out with a striped awning" viewBox="0 0 520 360" style="width: 100%; height: auto">
      <rect x="40" y="60" width="440" height="280" rx="10" fill="#fff" stroke="#2B1A12" stroke-width="4"/>
      <g><path d="M30 60 H490 L470 130 H50Z" fill="#E23B24"/><g fill="#FFF4DF"><path d="M90 60 H140 L130 130 H90Z"/><path d="M190 60 H240 L236 130 H190Z"/><path d="M290 60 H340 L340 130 H294Z"/><path d="M390 60 H440 L450 130 H400Z"/></g></g>
      <text x="260" y="44" text-anchor="middle" font-family="Shrikhand, cursive" font-size="40" fill="#A82414">Pace's</text>
      <rect x="80" y="170" width="190" height="130" rx="8" fill="#FFE7A8" stroke="#2B1A12" stroke-width="3"/>
      <rect x="320" y="170" width="110" height="170" rx="8" fill="#2F7D4A" stroke="#2B1A12" stroke-width="3"/>
      <circle cx="408" cy="260" r="6" fill="#FFC93C"/>
      <text x="175" y="245" text-anchor="middle" font-family="DM Sans, sans-serif" font-weight="700" font-size="22" fill="#A82414">OPEN</text>
    </svg>
  </section>

  <footer style="background: var(--sauce); color: #FFE2C9">
    <div style="max-width: 1280px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; font-size: 14px"><span class="pt-script" style="font-size: 26px; color: #fff">Pace's</span><span>Take Out &amp; Catering · 432 Elgin St, Brantford · 519-753-0060</span></div>
  </footer>
  <div aria-hidden="true" class="pt-check" style="height: 22px"></div>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Pace&#x27;s Take Out &amp; Catering. Not the official Pace&#x27;s Take Out &amp; Catering website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { g: 1 }; }
  renderVals() {
    var self = this;
    var opts = [
      { label: "20", n: 20, title: "A family get-together", note: "Twenty people is a proper family dinner. We'll suggest dishes that travel well and stay hot." },
      { label: "50", n: 50, title: "A party of fifty", note: "Showers, birthdays and open houses. Let us know the date early and we'll plan quantities with you." },
      { label: "100", n: 100, title: "A big celebration", note: "For a hundred guests we'll talk through the menu, pickup or drop-off, and timing." },
      { label: "Office", n: 30, title: "An office lunch", note: "Feed the team on a weekday with take-out trays, or book a weekend event." }
    ];
    var cur = opts[this.state.g];
    var cols = ["#E23B24", "#FFC93C", "#2F7D4A", "#A82414"];
    var dots = [];
    for (var i = 0; i < Math.min(cur.n, 100); i++) dots.push({ c: cols[i % 4] });
    return {
      guests: opts.map(function (o, i) {
        var on = i === self.state.g;
        return { label: o.label, sel: on ? "true" : "false", pick: function () { self.setState({ g: i }); },
          style: on ? "background:#E23B24;color:#fff;border:2px solid #E23B24" : "background:#fff;color:#2B1A12;border:2px solid #F6D9A8" };
      }),
      party: { title: cur.title, note: cur.note, dots: dots }
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
