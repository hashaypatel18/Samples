<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Kelleher Tech</title>
<meta name="description" content="A sample homepage design made for Kelleher Tech by Hashay Patel. Not the official Kelleher Tech website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#100D1E}
*{box-sizing:border-box}
.kt{--void:#100D1E;--panel:#1B1730;--edge:#2E2850;--cyan:#33E3F5;--flare:#FF6B3D;--mist:#C9C4E6;--white:#F5F3FF;font-family:'Chakra Petch',system-ui,sans-serif;color:var(--white);background:var(--void)}
@keyframes ktEq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
@keyframes ktScan{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
@keyframes ktGlow{0%,100%{opacity:.5}50%{opacity:1}}
.kt-eq{transform-origin:bottom;transform-box:fill-box;animation:ktEq .9s ease-in-out infinite}
.kt-scan{animation:ktScan 3.5s linear infinite}
.kt-glow{animation:ktGlow 2.2s ease-in-out infinite}
.kt-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;font:700 16px 'Chakra Petch',sans-serif;text-decoration:none;border:0;cursor:pointer;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px)}
.kt-btn:focus-visible,.kt-tab:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}
.kt-tab{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:0 18px;cursor:pointer;font:600 16px 'Chakra Petch',sans-serif;text-align:left}
.kt-nav a{color:var(--mist);text-decoration:none;font-weight:500}
.kt-nav a:hover{color:var(--cyan)}
@media (max-width:820px){.kt-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.kt-eq,.kt-scan,.kt-glow{animation:none}}
</style>

</head>

        <p style="margin: 6px 0 0; font-size: 24px; font-weight: 700"><a href="tel:+12047179600" style="color: var(--cyan)">204-717-9600</a></p>
        <p style="margin: 0; color: var(--mist)">ricco@kellehertech.ca</p>
      </div>
      <form aria-label="Ask for a quote" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; background: var(--panel); border: 1px solid var(--edge); padding: 30px">
        <label style="display: grid; gap: 8px; font-weight: 600">Name<input type="text" style="min-height: 54px; padding: 0 14px; background: var(--void); border: 1px solid var(--edge); color: var(--white); font: 400 16px 'Chakra Petch', sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 600">Phone<input type="tel" style="min-height: 54px; padding: 0 14px; background: var(--void); border: 1px solid var(--edge); color: var(--white); font: 400 16px 'Chakra Petch', sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">Vehicle or device<input type="text" placeholder="e.g. 2019 F-150, or a PS5" style="min-height: 54px; padding: 0 14px; background: var(--void); border: 1px solid var(--edge); color: var(--white); font: 400 16px 'Chakra Petch', sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">What do you need?<select style="min-height: 54px; padding: 0 14px; background: var(--void); border: 1px solid var(--edge); color: var(--white); font: 400 16px 'Chakra Petch', sans-serif"><option>Remote starter</option><option>Audio / video</option><option>Alarm or GPS tracking</option><option>Lighting</option><option>Electronics repair</option></select></label>

      <span style="color: var(--white); font-weight: 700">Kelleher Tech &amp; Autosound</span><span>Brandon, Manitoba · 204-717-9600</span>
    </div>
  </footer>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Kelleher Tech. Not the official Kelleher Tech website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { u: "start" }; }
  renderVals() {
    var self = this;
    var ups = [
      { id: "start", icon: "🔑", name: "Remote starters & alarms", desc: "Warm up the truck from the kitchen on a -30 morning, and know it's protected the rest of the day.", tags: ["Remote start", "Alarm systems", "Cruise control"] },
      { id: "audio", icon: "🔊", name: "Audio & video", desc: "Head units, speakers, amps and screens, tuned so it sounds right in your vehicle, not just loud.", tags: ["Head units", "Speakers & amps", "Video"] },
      { id: "light", icon: "💡", name: "Interior & exterior lighting", desc: "Brighter driving lights and clean interior lighting, wired in properly with no flicker.", tags: ["Exterior", "Interior", "Accent"] },
      { id: "gps", icon: "📍", name: "GPS & mobile tracking", desc: "Know where your vehicle or fleet is from your phone, with tracking installed out of sight.", tags: ["Personal", "Fleet", "Theft recovery"] },
      { id: "fix", icon: "🛠️", name: "Electronics repair", desc: "TVs, home audio and game consoles brought back to life, including micro-soldering on the board.", tags: ["Consoles", "TV & audio", "Micro-soldering"] }
    ];
    var cur = ups.filter(function (u) { return u.id === self.state.u; })[0];
    return {
      ups: ups.map(function (u) {
        var on = u.id === self.state.u;
        return { icon: u.icon, name: u.name, sel: on ? "true" : "false", pick: function () { self.setState({ u: u.id }); },
          style: on ? "background:#33E3F5;color:#100D1E;border:1px solid #33E3F5" : "background:#1B1730;color:#F5F3FF;border:1px solid #2E2850" };
      }),
      cur: { icon: cur.icon, name: cur.name, desc: cur.desc, tags: cur.tags.map(function (t) { return { t: t }; }) },
