<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Favoured Plumbing and Heating</title>
<meta name="description" content="A sample homepage design made for Favoured Plumbing and Heating by Hashay Patel. Not the official Favoured Plumbing and Heating website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,400..900;1,400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EAF4FB}
*{box-sizing:border-box}
.fp{--foam:#EAF4FB;--water:#1C6FB8;--sky:#7CC3F0;--navy:#0D2238;--copper:#C77B3F;--warm:#FFB066;font-family:'Red Hat Display',system-ui,sans-serif;color:var(--navy);background:var(--foam)}
.fp h1,.fp h2{font-weight:900;letter-spacing:-.035em}
@keyframes fpFlow{to{stroke-dashoffset:-60}}
@keyframes fpDrop{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(90px);opacity:0}}
@keyframes fpRipple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
@keyframes fpSteam{0%{transform:translateY(0);opacity:0}30%{opacity:.7}100%{transform:translateY(-40px);opacity:0}}
.fp-flow{stroke-dasharray:18 12;animation:fpFlow 1.4s linear infinite}
.fp-drop{animation:fpDrop 2.2s ease-in infinite}
.fp-rip{transform-box:fill-box;transform-origin:center;animation:fpRipple 2.2s ease-out infinite}
.fp-steam{animation:fpSteam 3s ease-out infinite}
.fp-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;border-radius:999px;font:800 16px 'Red Hat Display',sans-serif;text-decoration:none;border:0;cursor:pointer}
.fp-btn:focus-visible,.fp-prob:focus-visible{outline:3px solid var(--copper);outline-offset:3px}
.fp-prob{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:4px;min-height:84px;padding:14px 18px;border-radius:18px;cursor:pointer;font:700 16px 'Red Hat Display',sans-serif;text-align:left}
.fp-nav a{color:var(--navy);text-decoration:none;font-weight:700}
.fp-nav a:hover{color:var(--water)}
@media (max-width:820px){.fp-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.fp-flow,.fp-drop,.fp-rip,.fp-steam{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="fp">
  <header style="max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--navy)">
      <svg aria-hidden="true" width="42" height="42" viewBox="0 0 42 42"><path d="M21 4 C21 4 8 19 8 27 a13 13 0 0 0 26 0 C34 19 21 4 21 4Z" fill="#1C6FB8"/><path d="M15 27 a6 6 0 0 0 6 6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      <span style="font-weight: 900; font-size: 20px; line-height: 1.05; white-space: nowrap">Favoured<span style="display: block; font-weight: 600; font-size: 13px; color: var(--copper)">Plumbing &amp; Heating</span></span>
    </a>
    <nav class="fp-nav" aria-label="Main" style="display: flex; gap: 28px"><a href="#problem">What's wrong?</a><a href="#reviews">Reviews</a><a href="#call">Contact</a></nav>
    <a class="fp-btn" href="tel:+15062320777" style="min-height: 46px; padding: 0 18px; background: var(--navy); color: #fff; white-space: nowrap">506-232-0777</a>
  </header>

  <section id="top" style="max-width: 1280px; margin: 0 auto; padding: 24px 24px 90px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr)); gap: 44px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-wrap: wrap; gap: 10px">
        <span style="padding: 8px 14px; border-radius: 999px; background: #fff; font-weight: 700; font-size: 14px">★ 4.7 from 30 Google reviews</span>
        <span style="padding: 8px 14px; border-radius: 999px; background: var(--water); color: #fff; font-weight: 700; font-size: 14px">Open 7 days</span>
      </div>
      <h1 style="margin: 0; font-size: clamp(54px, 7vw, 100px); line-height: .95">Small drips to big leaks, sorted fast.</h1>
      <p style="margin: 0; font-size: 19px; line-height: 1.65; color: #3C5168; max-width: 520px">Plumbing and heating repairs for homes across Moncton. Quick to respond, polite in your home, and open evenings and weekends when things go wrong.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a class="fp-btn" href="tel:+15062320777" style="background: var(--water); color: #fff">Call 506-232-0777</a>
        <a class="fp-btn" href="#problem" style="background: #fff; color: var(--navy); box-shadow: inset 0 0 0 2px var(--navy)">What's wrong?</a>
      </div>
    </div>
    <div style="border-radius: 36px; background: var(--navy); padding: 30px; overflow: hidden">
      <svg role="img" aria-label="Copper pipes with water flowing through them into a tap, and a drop rippling into a basin" viewBox="0 0 480 400" style="display: block; width: 100%; height: auto">
        <g fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 70 H170 Q200 70 200 100 V170 Q200 200 230 200 H330" stroke="#C77B3F" stroke-width="30"/>
          <path d="M20 70 H170 Q200 70 200 100 V170 Q200 200 230 200 H330" stroke="#7CC3F0" stroke-width="8" class="fp-flow"/>
          <path d="M460 40 H400 Q370 40 370 70 V140" stroke="#C77B3F" stroke-width="30"/>
          <path d="M460 40 H400 Q370 40 370 70 V140" stroke="#FFB066" stroke-width="8" class="fp-flow" style="animation-direction: reverse"/>
        </g>
        <g fill="#C77B3F"><rect x="88" y="50" width="18" height="40" rx="4"/><rect x="180" y="128" width="40" height="18" rx="4"/><rect x="430" y="20" width="18" height="40" rx="4"/></g>
        <rect x="320" y="140" width="100" height="80" rx="20" fill="#DCE6EE"/>
        <rect x="344" y="120" width="52" height="26" rx="8" fill="#B8C7D3"/>
        <path d="M330 200 H360 V240" stroke="#DCE6EE" stroke-width="24" fill="none" stroke-linecap="round"/>
        <path class="fp-drop" d="M360 250 q-8 12 0 18 q8 -6 0 -18Z" fill="#7CC3F0"/>
        <path d="M240 340 Q360 400 470 340 Z" fill="#1C6FB8"/>
        <ellipse class="fp-rip" cx="360" cy="344" rx="40" ry="8" fill="none" stroke="#7CC3F0" stroke-width="3"/>
        <g stroke="#FFB066" stroke-width="4" fill="none" stroke-linecap="round" opacity=".8"><path class="fp-steam" d="M400 100 q8 -10 0 -20"/><path class="fp-steam" style="animation-delay:1s" d="M420 104 q8 -10 0 -20"/></g>
        <g font-family="Red Hat Display, sans-serif" font-size="14" font-weight="800" fill="#7CC3F0"><text x="20" y="120">COLD</text></g>
        <g font-family="Red Hat Display, sans-serif" font-size="14" font-weight="800" fill="#FFB066"><text x="462" y="84" text-anchor="end">HOT</text></g>
      </svg>
    </div>
  </section>

  <section id="problem" style="background: #fff">
    <div style="max-width: 1280px; margin: 0 auto; padding: 96px 24px">
      <h2 style="margin: 0 0 12px; font-size: clamp(44px, 5.4vw, 72px); line-height: 1">What's going on?</h2>
      <p style="margin: 0 0 32px; font-size: 18px; line-height: 1.6; color: #3C5168; max-width: 560px">Tap the problem. We'll tell you how urgent it is and what you can safely do before we arrive.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 28px; align-items: start">
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 10px">
          <sc-for list="{{ probs }}" as="p" hint-placeholder-count="6"><button type="button" class="fp-prob" aria-pressed="{{ p.on }}" onClick="{{ p.pick }}" style="{{ p.style }}"><span aria-hidden="true" style="{{ p.dot }}"></span>{{ p.name }}</button></sc-for>
        </div>
        <div style="border-radius: 28px; background: var(--foam); padding: 32px; display: flex; flex-direction: column; gap: 16px">
          <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap"><h3 style="margin: 0; font-size: 30px; font-weight: 900">{{ name }}</h3><span style="{{ badge }}">{{ urgency }}</span></div>
          <div aria-hidden="true" style="height: 12px; border-radius: 99px; background: #D3E4F0; overflow: hidden"><div style="height: 100%; width: {{ level }}%; background: linear-gradient(90deg, #7CC3F0, #1C6FB8, #C2412D); border-radius: 99px; transition: width .4s ease"></div></div>
          <p style="margin: 0; font-weight: 800">Before we get there</p>
          <ul style="margin: 0; padding: 0 0 0 20px; display: grid; gap: 8px; line-height: 1.55; color: #3C5168">
            <sc-for list="{{ tips }}" as="t" hint-placeholder-count="2"><li>{{ t.t }}</li></sc-for>
          </ul>
          <a class="fp-btn" href="tel:+15062320777" style="background: var(--navy); color: #fff">Call 506-232-0777</a>
        </div>
      </div>
    </div>
  </section>

  <section id="reviews" style="max-width: 1280px; margin: 0 auto; padding: 96px 24px">
    <h2 style="margin: 0 0 32px; font-size: clamp(44px, 5.4vw, 72px); line-height: 1">Moncton homeowners say</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">
      <figure style="margin: 0; padding: 30px; border-radius: 28px; background: var(--water); color: #fff; display: flex; flex-direction: column; gap: 14px"><span aria-hidden="true">★★★★★</span><blockquote style="margin: 0; font-size: 22px; line-height: 1.35; font-weight: 700">"Quick response, very polite, excellent work repairing our shower."</blockquote><figcaption style="margin-top: auto; font-size: 14px; opacity: .8">Google review</figcaption></figure>
      <figure style="margin: 0; padding: 30px; border-radius: 28px; background: #fff; display: flex; flex-direction: column; gap: 14px"><span aria-hidden="true" style="color: var(--copper)">★★★★★</span><blockquote style="margin: 0; font-size: 22px; line-height: 1.35; font-weight: 700">"He is a pleasure to have in your home; I highly recommend his services."</blockquote><figcaption style="margin-top: auto; font-size: 14px; color: #5B6E82">Google review</figcaption></figure>
      <figure style="margin: 0; padding: 30px; border-radius: 28px; background: var(--copper); color: #fff; display: flex; flex-direction: column; gap: 14px"><span aria-hidden="true">★★★★★</span><blockquote style="margin: 0; font-size: 22px; line-height: 1.35; font-weight: 700">"I recommend him to anyone with small or big plumbing issues!"</blockquote><figcaption style="margin-top: auto; font-size: 14px; opacity: .85">Google review</figcaption></figure>
    </div>
  </section>

  <section id="call" style="background: var(--navy); color: #fff">
    <div style="max-width: 1280px; margin: 0 auto; padding: 90px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: clamp(44px, 5.4vw, 72px); line-height: 1">Call or book a visit</h2>
        <p style="margin: 0; font-size: 28px; font-weight: 900"><a href="tel:+15062320777" style="color: var(--sky)">506-232-0777</a></p>
        <p style="margin: 0; color: #B6C6D6">bobby2213@hotmail.com · Moncton, NB</p>
        <dl style="margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 24px; font-size: 17px">
          <dt style="font-weight: 800">Mon – Fri</dt><dd style="margin: 0; color: #B6C6D6">8 am – 8 pm</dd>
          <dt style="font-weight: 800">Saturday</dt><dd style="margin: 0; color: #B6C6D6">9 am – 5 pm</dd>
          <dt style="font-weight: 800">Sunday</dt><dd style="margin: 0; color: #B6C6D6">10 am – 5 pm</dd>
        </dl>
      </div>
      <form aria-label="Book a visit" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; background: var(--foam); color: var(--navy); padding: 26px; border-radius: 26px">
        <label style="display: grid; gap: 8px; font-weight: 800">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #CFE0EC; border-radius: 14px; font: 500 16px 'Red Hat Display', sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 800">Phone<input type="tel" style="min-height: 52px; padding: 0 14px; border: 2px solid #CFE0EC; border-radius: 14px; font: 500 16px 'Red Hat Display', sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 800">What's the problem?<textarea rows="3" style="padding: 12px 14px; border: 2px solid #CFE0EC; border-radius: 14px; font: 500 16px 'Red Hat Display', sans-serif"></textarea></label>
        <button type="button" class="fp-btn" style="grid-column: 1 / -1; background: var(--water); color: #fff">Request a visit</button>
      </form>
    </div>
  </section>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Favoured Plumbing and Heating. Not the official Favoured Plumbing and Heating website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { i: 1 }; }
  renderVals() {
    var self = this, cur = this.state.i;
    var lv = [
      { u: "Fix this week", c: "#7CC3F0", t: "#0D2238", w: 30 },
      { u: "Call today", c: "#FFB066", t: "#0D2238", w: 65 },
      { u: "Call now", c: "#C2412D", t: "#fff", w: 100 }
    ];
    var s = [
      { name: "Dripping tap", l: 0, tips: ["Turn the tap off firmly, without forcing it.", "Put a cloth in the sink to stop the drip noise overnight."] },
      { name: "Shower not working", l: 1, tips: ["Check whether other taps have hot and cold water.", "Note any noises or error codes from the water heater."] },
      { name: "Blocked drain", l: 1, tips: ["Stop using that sink, tub or toilet.", "Skip the chemical drain cleaners. They can damage pipes."] },
      { name: "Toilet keeps running", l: 0, tips: ["Turn the small valve behind the toilet clockwise to stop it.", "Lift the tank lid and check the flapper is seated."] },
      { name: "No heat or hot water", l: 1, tips: ["Check the breaker or pilot light for the heater.", "Keep doors closed to hold heat in the house."] },
      { name: "Leaking or burst pipe", l: 2, tips: ["Shut off the main water valve right away.", "Turn off power to any wet area if it's safe to reach the panel."] }
    ];
    var c = s[cur], L = lv[c.l];
    return {
      probs: s.map(function (x, i) { var on = i === cur; return { name: x.name, on: on ? "true" : "false", pick: function () { self.setState({ i: i }); }, style: on ? "background:#0D2238;color:#fff;border:2px solid #0D2238" : "background:#EAF4FB;color:#0D2238;border:2px solid #EAF4FB", dot: "width:12px;height:12px;border-radius:50%;background:" + lv[x.l].c }; }),
      name: c.name, urgency: L.u, level: L.w,
      badge: "padding:8px 14px;border-radius:999px;font-weight:800;font-size:14px;background:" + L.c + ";color:" + L.t,
      tips: c.tips.map(function (t) { return { t: t }; })
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
