<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Upholstery King</title>
<meta name="description" content="A sample homepage design made for Upholstery King by Hashay Patel. Not the official Upholstery King website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&amp;family=Manrope:wght@400..800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#111214}
*{box-sizing:border-box}
.uk{--black:#111214;--hide:#1E2024;--panel:#2A2D33;--chrome:#C9CED6;--red:#D7263D;--tan:#C08552;--light:#F2F3F5;font-family:Manrope,system-ui,sans-serif;color:var(--light);background:var(--black)}
.uk-d{font-family:'Chakra Petch',sans-serif;font-weight:700;letter-spacing:.01em;text-transform:uppercase}
@keyframes ukSew{to{stroke-dashoffset:-56}}
@keyframes ukNeedle{0%,100%{transform:translateY(0)}50%{transform:translateY(14px)}}
@keyframes ukShine{0%{transform:translateX(-200px)}100%{transform:translateX(520px)}}
.uk-sew{animation:ukSew 1.6s linear infinite}
.uk-needle{animation:ukNeedle .4s ease-in-out infinite}
.uk-shine{animation:ukShine 4s ease-in-out infinite}
.uk-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:2px;font:800 16px Manrope,sans-serif;text-decoration:none;border:0;cursor:pointer;letter-spacing:.02em}
.uk-btn:focus-visible,.uk-opt:focus-visible,.uk-nav a:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.uk-opt{min-height:52px;padding:0 16px;border-radius:2px;cursor:pointer;font:700 15px Manrope,sans-serif;display:inline-flex;align-items:center;gap:10px}
.uk-nav a{color:var(--light);text-decoration:none;font-weight:600;opacity:.85}
.uk-nav a:hover{opacity:1;color:var(--red)}
@media (max-width:820px){.uk-nav{display:none !important}}
@media (max-width:600px){.uk-tag{display:none}.uk-logo{font-size:20px !important;white-space:normal !important}}
@media (prefers-reduced-motion:reduce){.uk-sew,.uk-needle,.uk-shine{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="uk">
  <header style="max-width: 1280px; margin: 0 auto; padding: 20px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" class="uk-d uk-logo" style="font-size: 26px; color: var(--light); text-decoration: none; white-space: nowrap; display: flex; align-items: center; gap: 10px"><svg aria-hidden="true" width="30" height="26" viewBox="0 0 30 26"><path d="M2 24 L4 6 L10 13 L15 2 L20 13 L26 6 L28 24Z" fill="#D7263D"/></svg>Upholstery King<span class="uk-tag" style="font-family: Manrope, sans-serif; text-transform: none; font-size: 14px; font-weight: 600; opacity: .65">Car interiors · Randburg</span></a>
    <nav class="uk-nav" aria-label="Main" style="display: flex; gap: 28px"><a href="#build">Design your seat</a><a href="#work">Our work</a><a href="#reviews">Reviews</a><a href="#visit">Visit</a></nav>
    <a class="uk-btn" href="tel:+27781370863" style="min-height: 46px; padding: 0 18px; background: var(--red); color: #fff; white-space: nowrap">078 137 0863</a>
  </header>

  <section id="top" style="position: relative; overflow: hidden; border-top: 1px solid #2A2D33">
    <div style="max-width: 1280px; margin: 0 auto; padding: 48px 24px 84px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 480px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 24px">
        <p style="margin: 0; align-self: flex-start; padding: 8px 14px; border-left: 4px solid var(--red); background: var(--hide); font-weight: 700; font-size: 15px"><span style="color: var(--red)">★ 5.0</span> from 125 Google reviews</p>
        <h1 class="uk-d" style="margin: 0; font-size: clamp(50px, 7.4vw, 104px); line-height: .92">Your car's interior, made new again.</h1>
        <p style="margin: 0; font-size: 19px; line-height: 1.6; max-width: 540px; color: #B9BEC6">Seats re-covered in leather, roof linings replaced and worn upholstery repaired, in Ferndale, Randburg.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="uk-btn" href="#build" style="background: var(--red); color: #fff">Design your seat</a>
          <a class="uk-btn" href="#visit" style="background: transparent; color: var(--light); box-shadow: inset 0 0 0 2px #3A3E46">Get a quote</a>
        </div>
      </div>
      <svg role="img" aria-label="Illustration of a car seat being stitched with red thread by a sewing needle" viewBox="0 0 560 440" style="display: block; width: 100%; height: auto">
        <defs><clipPath id="ukSeat"><path d="M150 60 Q150 30 186 30 H330 Q366 30 366 60 L376 250 Q378 270 358 272 H160 Q140 270 142 250Z"/></clipPath><linearGradient id="ukL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2E3036"/><stop offset="1" stop-color="#141518"/></linearGradient></defs>
        <rect x="20" y="20" width="520" height="400" fill="#1A1B1F"/>
        <path d="M20 360 H540" stroke="#2A2D33" stroke-width="2"/>
        <path d="M150 60 Q150 30 186 30 H330 Q366 30 366 60 L376 250 Q378 270 358 272 H160 Q140 270 142 250Z" fill="url(#ukL)"/>
        <g clip-path="url(#ukSeat)"><path d="M210 30 V272 M306 30 V272" stroke="#0C0D0F" stroke-width="6"/><rect class="uk-shine" x="0" y="20" width="60" height="270" fill="#fff" opacity=".07" transform="skewX(-14)"/></g>
        <path class="uk-sew" d="M204 44 V262 M312 44 V262" stroke="#D7263D" stroke-width="3" stroke-dasharray="10 4"/>
        <path d="M120 290 Q118 262 146 262 H372 Q400 262 398 290 L392 340 Q390 356 372 356 H146 Q128 356 126 340Z" fill="url(#ukL)"/>
        <path class="uk-sew" d="M140 300 H380" stroke="#D7263D" stroke-width="3" stroke-dasharray="10 4"/>
        <rect x="196" y="356" width="18" height="34" fill="#2A2D33"/><rect x="304" y="356" width="18" height="34" fill="#2A2D33"/>
        <g class="uk-needle"><rect x="440" y="40" width="54" height="120" rx="4" fill="#C9CED6"/><rect x="460" y="160" width="6" height="70" fill="#E8EBEF"/><path d="M463 230 l-3 18 h6Z" fill="#E8EBEF"/></g>
        <path d="M463 250 Q430 290 380 300" stroke="#D7263D" stroke-width="2" fill="none" stroke-dasharray="4 4"/>
      </svg>
    </div>
  </section>

  <section id="build" style="background: var(--light); color: var(--black)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <h2 class="uk-d" style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: .95">Design your seat</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.6; color: #4A4F57; max-width: 470px">Pick a cover and a stitch colour to see the look. Bring the idea in and we'll talk it through with real samples.</p>
        <p style="margin: 8px 0 0; font-weight: 800; font-size: 14px; letter-spacing: .1em; text-transform: uppercase">Cover</p>
        <div role="group" aria-label="Cover material" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{ mats }}" as="m" hint-placeholder-count="4"><button type="button" class="uk-opt" aria-pressed="{{ m.on }}" onClick="{{ m.pick }}" style="{{ m.style }}"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: {{ m.c }}; box-shadow: 0 0 0 2px #fff"></span>{{ m.name }}</button></sc-for>
        </div>
        <p style="margin: 8px 0 0; font-weight: 800; font-size: 14px; letter-spacing: .1em; text-transform: uppercase">Stitching</p>
        <div role="group" aria-label="Stitch colour" style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{ stitches }}" as="t" hint-placeholder-count="4"><button type="button" class="uk-opt" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}"><span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 50%; background: {{ t.c }}; box-shadow: 0 0 0 2px #fff"></span>{{ t.name }}</button></sc-for>
        </div>
      </div>
      <div style="background: var(--black); color: var(--light); padding: 28px; border-bottom: 6px solid var(--red)">
        <svg role="img" aria-label="{{ alt }}" viewBox="0 0 420 380" style="display: block; width: 100%; height: auto">
          <path d="M110 40 Q110 14 140 14 H280 Q310 14 310 40 L320 230 Q322 248 304 250 H116 Q98 248 100 230Z" fill="{{ mc }}"/>
          <path d="M160 14 V250 M260 14 V250" stroke="#000" stroke-width="5" opacity=".35"/>
          <path d="M154 26 V240 M266 26 V240" stroke="{{ tc }}" stroke-width="3" stroke-dasharray="9 4"/>
          <path d="M80 268 Q78 244 104 244 H316 Q342 244 340 268 L334 312 Q332 326 316 326 H104 Q88 326 86 312Z" fill="{{ mc }}"/>
          <path d="M98 276 H322" stroke="{{ tc }}" stroke-width="3" stroke-dasharray="9 4"/>
          <path d="{{ tex }}" stroke="#fff" stroke-width="1.5" opacity=".12" fill="none"/>
          <rect x="150" y="326" width="18" height="34" fill="#2A2D33"/><rect x="252" y="326" width="18" height="34" fill="#2A2D33"/>
        </svg>
        <p style="margin: 14px 0 0; font-size: 18px"><strong>{{ mname }}</strong> with <strong>{{ tname }}</strong> stitching</p>
        <p style="margin: 6px 0 0; color: #B9BEC6">{{ mnote }}</p>
      </div>
    </div>
  </section>

  <section id="work" style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
    <h2 class="uk-d" style="margin: 0 0 34px; font-size: clamp(40px, 5vw, 66px); line-height: .95">What we do</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 2px; background: #2A2D33">
      <article style="padding: 30px; background: var(--black); display: flex; flex-direction: column; gap: 10px"><span class="uk-d" style="color: var(--red); font-size: 15px">01</span><h3 style="margin: 0; font-size: 22px">Leather seats</h3><p style="margin: 0; line-height: 1.6; color: #B9BEC6">Car seats re-covered and refurbished in leather.</p></article>
      <article style="padding: 30px; background: var(--black); display: flex; flex-direction: column; gap: 10px"><span class="uk-d" style="color: var(--red); font-size: 15px">02</span><h3 style="margin: 0; font-size: 22px">Roof linings</h3><p style="margin: 0; line-height: 1.6; color: #B9BEC6">Sagging headliners replaced and roofs restored.</p></article>
      <article style="padding: 30px; background: var(--black); display: flex; flex-direction: column; gap: 10px"><span class="uk-d" style="color: var(--red); font-size: 15px">03</span><h3 style="margin: 0; font-size: 22px">Upholstery repair</h3><p style="margin: 0; line-height: 1.6; color: #B9BEC6">Tears, splits and worn panels fixed properly.</p></article>
      <article style="padding: 30px; background: var(--red); display: flex; flex-direction: column; gap: 10px"><span class="uk-d" style="font-size: 44px; line-height: 1">5.0</span><h3 style="margin: 0; font-size: 22px">125 Google reviews</h3><p style="margin: 0; line-height: 1.6">A perfect average from Joburg drivers.</p></article>
    </div>
  </section>

  <section id="reviews" style="background: var(--hide)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 92px 24px">
      <h2 class="uk-d" style="margin: 0 0 34px; font-size: clamp(40px, 5vw, 66px); line-height: .95">Straight from the driver's seat</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">
        <figure style="margin: 0; padding: 28px; background: var(--black); border-top: 4px solid var(--red); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 20px; line-height: 1.5; font-weight: 600">“They did a seriously amazing job on my Suzuki Eeco seats. I opted for leather and the craftsmanship is superb.”</blockquote><figcaption style="color: var(--red); font-weight: 800">Google review</figcaption></figure>
        <figure style="margin: 0; padding: 28px; background: var(--black); border-top: 4px solid var(--chrome); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 20px; line-height: 1.5; font-weight: 600">“Brilliant service and workmanship from Charly and his team. The refurbishment of my car seats is fantastic.”</blockquote><figcaption style="color: var(--chrome); font-weight: 800">Google review</figcaption></figure>
        <figure style="margin: 0; padding: 28px; background: var(--black); border-top: 4px solid var(--tan); display: flex; flex-direction: column; gap: 14px"><blockquote style="margin: 0; font-size: 20px; line-height: 1.5; font-weight: 600">“The quality of the workmanship and attention to detail is beyond amazing.”</blockquote><figcaption style="color: var(--tan); font-weight: 800">Google review</figcaption></figure>
      </div>
    </div>
  </section>

  <section id="visit" style="background: var(--black)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 88px 24px 110px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <h2 class="uk-d" style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: .95">Find the workshop</h2>
        <p style="margin: 0; font-size: 19px; line-height: 1.6">Behind Bosch Car Service<br>97 Republic Road, Ferndale<br>Randburg, 2194</p>
        <p style="margin: 0; font-size: 17px; line-height: 1.7; color: #B9BEC6">Mon – Wed &amp; Fri · 8:00 – 17:00<br>Thursday · 9:00 – 17:00<br>Saturday · 8:30 – 15:00<br>Sunday · Closed</p>
        <p style="margin: 0; font-size: 28px; font-weight: 800"><a href="tel:+27781370863" style="color: var(--red)">078 137 0863</a></p>
      </div>
      <form aria-label="Request a quote" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; padding: 26px; background: var(--hide)">
        <label style="display: grid; gap: 8px; font-weight: 700">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #3A3E46; border-radius: 2px; background: var(--black); color: var(--light); font: 400 16px Manrope, sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 700">Cell number<input type="tel" style="min-height: 52px; padding: 0 14px; border: 2px solid #3A3E46; border-radius: 2px; background: var(--black); color: var(--light); font: 400 16px Manrope, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">Vehicle<input type="text" placeholder="e.g. 2018 Polo Vivo" style="min-height: 52px; padding: 0 14px; border: 2px solid #3A3E46; border-radius: 2px; background: var(--black); color: var(--light); font: 400 16px Manrope, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 700">What needs doing?<select style="min-height: 52px; padding: 0 14px; border: 2px solid #3A3E46; border-radius: 2px; background: var(--black); color: var(--light); font: 400 16px Manrope, sans-serif"><option>Seats</option><option>Roof lining</option><option>Repair</option><option>Something else</option></select></label>
        <button type="button" class="uk-btn" style="grid-column: 1 / -1; background: var(--red); color: #fff">Send my request</button>
      </form>
    </div>
  </section>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Upholstery King. Not the official Upholstery King website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { m: 0, t: 0 }; }
  renderVals() {
    var self = this;
    var m = [
      { name: "Black leather", c: "#1B1C20", note: "Classic, easy to wipe clean", tex: "" },
      { name: "Tan leather", c: "#B0743F", note: "Warm and upmarket", tex: "" },
      { name: "Grey fabric", c: "#5E636B", note: "Breathable on hot days", tex: "M110 60 H310 M110 100 H310 M110 140 H310 M110 180 H310 M110 220 H310" },
      { name: "Red leather", c: "#8E1B2B", note: "A bold statement", tex: "" }
    ];
    var t = [
      { name: "red", c: "#D7263D" }, { name: "white", c: "#F2F3F5" }, { name: "tan", c: "#C08552" }, { name: "blue", c: "#2F7DD1" }
    ];
    var cm = m[this.state.m], ct = t[this.state.t];
    function st(on) { return on ? "background:#111214;color:#F2F3F5;border:2px solid #111214" : "background:#fff;color:#111214;border:2px solid #CDD1D7"; }
    return {
      mats: m.map(function (x, i) { return { name: x.name, c: x.c, on: i === self.state.m ? "true" : "false", pick: function () { self.setState({ m: i }); }, style: st(i === self.state.m) }; }),
      stitches: t.map(function (x, i) { return { name: x.name.charAt(0).toUpperCase() + x.name.slice(1), c: x.c, on: i === self.state.t ? "true" : "false", pick: function () { self.setState({ t: i }); }, style: st(i === self.state.t) }; }),
      mc: cm.c, tc: ct.c, tex: cm.tex, mname: cm.name, tname: ct.name, mnote: cm.note,
      alt: "Car seat preview in " + cm.name + " with " + ct.name + " stitching"
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
