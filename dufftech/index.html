<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for DuffTech</title>
<meta name="description" content="A sample homepage design made for DuffTech by Hashay Patel. Not the official DuffTech website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF0F6}
*{box-sizing:border-box}
.dt{--bg:#EEF0F6;--card:#FFFFFF;--ink:#171A2B;--mute:#5B6180;--violet:#6A4CFF;--pink:#FF4FA3;--lime:#B6F23A;--teal:#14C8B4;font-family:Oxanium,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
@keyframes dtHue{to{filter:hue-rotate(360deg)}}
@keyframes dtSpin{to{transform:rotate(360deg)}}
@keyframes dtFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.dt-rgb{animation:dtHue 6s linear infinite}
.dt-fan{transform-box:fill-box;transform-origin:center;animation:dtSpin 1.2s linear infinite}
.dt-float{animation:dtFloat 5s ease-in-out infinite}
.dt-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 26px;border-radius:14px;font:700 16px Oxanium,sans-serif;text-decoration:none;border:0;cursor:pointer}
.dt-btn:focus-visible,.dt-tier:focus-visible{outline:3px solid var(--violet);outline-offset:3px}
.dt-tier{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:18px;border-radius:16px;cursor:pointer;font:600 15px Oxanium,sans-serif;text-align:left}
.dt-nav a{color:var(--ink);text-decoration:none;font-weight:600}
.dt-nav a:hover{color:var(--violet)}
@media (max-width:820px){.dt-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.dt-rgb,.dt-fan,.dt-float{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="dt">
  <header style="max-width: 1300px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink)">
      <span aria-hidden="true" class="dt-rgb" style="display: grid; place-items: center; width: 46px; height: 46px; border-radius: 12px; background: conic-gradient(#6A4CFF, #FF4FA3, #B6F23A, #14C8B4, #6A4CFF)"><span style="display: grid; place-items: center; width: 38px; height: 38px; border-radius: 9px; background: var(--ink); color: #fff; font-weight: 800">D</span></span>
      <span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-size: 24px; font-weight: 800; letter-spacing: -.01em">DuffTech</span><span style="font-size: 13px; color: var(--mute)">Repairs &amp; custom gaming PCs · Riverview, NB</span></span>
    </a>
    <nav class="dt-nav" aria-label="Main" style="display: flex; gap: 30px"><a href="#build">Build a rig</a><a href="#repair">Repairs</a><a href="#contact">Contact</a></nav>
    <a class="dt-btn" href="tel:+15063808539" style="min-height: 46px; background: var(--ink); color: #fff">506-380-8539</a>
  </header>

  <section id="top" style="max-width: 1300px; margin: 0 auto; padding: 24px 24px 90px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 40px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 24px">
      <p style="margin: 0; align-self: flex-start; padding: 8px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 0 0 1px #DADDEA; font-weight: 600; font-size: 14px">★ 5.0 on Google · 100% recommended on Facebook</p>
      <h1 style="margin: 0; font-size: clamp(52px, 7vw, 104px); line-height: .92; font-weight: 800; letter-spacing: -.03em">Your next gaming PC, built down the road.</h1>
      <p style="margin: 0; font-size: 19px; line-height: 1.65; color: var(--mute); max-width: 520px">Craig builds and sells custom gaming desktops at prices that make sense, and fixes desktops, laptops and tablets when they act up. Local, honest and easy to reach.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a class="dt-btn" href="#build" style="background: var(--violet); color: #fff">Spec my rig</a>
        <a class="dt-btn" href="#repair" style="background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink)">Book a repair</a>
      </div>
    </div>
    <figure style="margin: 0; position: relative">
      <div aria-hidden="true" class="dt-rgb" style="position: absolute; inset: 8% 10%; border-radius: 40px; background: conic-gradient(from 90deg, #6A4CFF, #FF4FA3, #B6F23A, #14C8B4, #6A4CFF); filter: blur(50px); opacity: .55"></div>
      <svg role="img" aria-label="A custom gaming PC tower with glowing RGB fans" viewBox="0 0 520 560" class="dt-float" style="position: relative; display: block; width: 100%; height: auto">
        <defs><linearGradient id="dtGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A2F4A"/><stop offset="1" stop-color="#121524"/></linearGradient><linearGradient id="dtRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6A4CFF"/><stop offset=".5" stop-color="#FF4FA3"/><stop offset="1" stop-color="#14C8B4"/></linearGradient></defs>
        <rect x="90" y="30" width="340" height="500" rx="26" fill="#0E1020"/>
        <rect x="104" y="44" width="250" height="472" rx="16" fill="url(#dtGlass)" stroke="#3A4066"/>
        <rect x="368" y="44" width="48" height="472" rx="10" fill="#1A1D33"/>
        <g class="dt-rgb">
          <g transform="translate(392 130)"><circle r="20" fill="none" stroke="url(#dtRing)" stroke-width="5"/></g>
          <g transform="translate(392 240)"><circle r="20" fill="none" stroke="url(#dtRing)" stroke-width="5"/></g>
          <g transform="translate(392 350)"><circle r="20" fill="none" stroke="url(#dtRing)" stroke-width="5"/></g>
          <rect x="128" y="90" width="200" height="10" rx="5" fill="url(#dtRing)"/>
          <rect x="128" y="300" width="200" height="42" rx="8" fill="url(#dtRing)" opacity=".85"/>
        </g>
        <rect x="140" y="130" width="120" height="120" rx="10" fill="#1F2340" stroke="#3A4066"/>
        <g transform="translate(200 190)"><circle r="46" fill="#0E1020" stroke="#3A4066" stroke-width="3"/><g class="dt-fan" fill="#5B6180"><path d="M0 -6 C20 -40 40 -20 6 0Z"/><path d="M6 0 C40 20 20 40 0 6Z"/><path d="M0 6 C-20 40 -40 20 -6 0Z"/><path d="M-6 0 C-40 -20 -20 -40 0 -6Z"/></g><circle r="10" fill="#B6F23A"/></g>
        <g fill="#2A2F4A"><rect x="276" y="130" width="14" height="120" rx="3"/><rect x="296" y="130" width="14" height="120" rx="3"/></g>
        <g fill="#B6F23A"><rect x="276" y="130" width="14" height="10" rx="3"/><rect x="296" y="130" width="14" height="10" rx="3"/></g>
        <text x="228" y="327" text-anchor="middle" font-family="Oxanium, sans-serif" font-weight="800" font-size="18" fill="#0E1020">DUFFTECH</text>
        <g transform="translate(160 420)"><circle r="40" fill="#0E1020" stroke="#3A4066" stroke-width="3"/><g class="dt-fan" fill="#5B6180"><path d="M0 -5 C18 -34 34 -18 5 0Z"/><path d="M5 0 C34 18 18 34 0 5Z"/><path d="M0 5 C-18 34 -34 18 -5 0Z"/><path d="M-5 0 C-34 -18 -18 -34 0 -5Z"/></g></g>
        <g transform="translate(270 420)"><circle r="40" fill="#0E1020" stroke="#3A4066" stroke-width="3"/><g class="dt-fan" fill="#5B6180"><path d="M0 -5 C18 -34 34 -18 5 0Z"/><path d="M5 0 C34 18 18 34 0 5Z"/><path d="M0 5 C-18 34 -34 18 -5 0Z"/><path d="M-5 0 C-34 -18 -18 -34 0 -5Z"/></g></g>
        <circle cx="392" cy="470" r="8" fill="#B6F23A"/>
      </svg>
      <figcaption style="position: absolute; right: 0; top: 30px; padding: 14px 18px; border-radius: 16px; background: var(--card); box-shadow: 0 20px 40px -20px rgba(23,26,43,.4); font-weight: 700">Built &amp; tested<br><span style="font-weight: 500; color: var(--mute)">before it leaves the bench</span></figcaption>
    </figure>
  </section>

  <section id="build" style="background: var(--ink); color: #fff">
    <div style="max-width: 1300px; margin: 0 auto; padding: 100px 24px">
      <h2 style="margin: 0 0 12px; font-size: clamp(38px, 5vw, 66px); line-height: 1; font-weight: 800; letter-spacing: -.02em">Spec your rig</h2>
      <p style="margin: 0 0 40px; color: #A9AEC8; font-size: 18px; max-width: 560px">Pick what you want to play at. Craig will put together the parts list and a price that fits your budget.</p>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 24px">
        <div role="radiogroup" aria-label="Performance tier" style="display: grid; gap: 10px; align-content: start">
          <sc-for list="{{ tiers }}" as="t" hint-placeholder-count="3">
            <button type="button" role="radio" class="dt-tier" aria-checked="{{ t.sel }}" onClick="{{ t.pick }}" style="{{ t.style }}"><span style="font-size: 22px; font-weight: 800">{{ t.name }}</span><span style="opacity: .75">{{ t.sub }}</span></button>
          </sc-for>
        </div>
        <article style="position: relative; border-radius: 22px; padding: 2px; background: conic-gradient(from 120deg, #6A4CFF, #FF4FA3, #B6F23A, #14C8B4, #6A4CFF)">
          <div style="border-radius: 20px; background: #1E2238; padding: 34px; height: 100%; display: flex; flex-direction: column; gap: 18px">
            <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap"><h3 style="margin: 0; font-size: 32px; font-weight: 800">{{ cur.name }} build</h3><span style="color: var(--lime); font-weight: 700">{{ cur.target }}</span></div>
            <ul style="margin: 0; padding: 0; list-style: none; display: grid; gap: 10px">
              <sc-for list="{{ cur.parts }}" as="p" hint-placeholder-count="5">
                <li style="display: grid; grid-template-columns: 110px 1fr; gap: 14px; padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,.05)"><span style="color: #A9AEC8">{{ p.k }}</span><span style="font-weight: 600">{{ p.v }}</span></li>
              </sc-for>
            </ul>
            <a class="dt-btn" href="#contact" style="margin-top: auto; background: var(--lime); color: var(--ink)">Ask Craig for a quote on this</a>
          </div>
        </article>
      </div>
    </div>
  </section>

  <section id="repair" style="max-width: 1300px; margin: 0 auto; padding: 100px 24px">
    <h2 style="margin: 0 0 36px; font-size: clamp(38px, 5vw, 66px); line-height: 1; font-weight: 800; letter-spacing: -.02em">Not gaming? Still fixed.</h2>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px">
      <article style="border-radius: 22px; padding: 30px; background: var(--card); display: flex; flex-direction: column; gap: 12px; min-height: 230px"><span aria-hidden="true" style="font-size: 40px">🖥️</span><h3 style="margin: 0; font-size: 26px">Desktops</h3><p style="margin: 0; color: var(--mute); line-height: 1.6">Slow boots, dead power supplies, upgrades and clean-outs.</p></article>
      <article style="border-radius: 22px; padding: 30px; background: var(--card); display: flex; flex-direction: column; gap: 12px; min-height: 230px"><span aria-hidden="true" style="font-size: 40px">💻</span><h3 style="margin: 0; font-size: 26px">Laptops</h3><p style="margin: 0; color: var(--mute); line-height: 1.6">Screens, keyboards, batteries and the "it just won't turn on" kind.</p></article>
      <article style="border-radius: 22px; padding: 30px; background: var(--card); display: flex; flex-direction: column; gap: 12px; min-height: 230px"><span aria-hidden="true" style="font-size: 40px">📱</span><h3 style="margin: 0; font-size: 26px">Tablets</h3><p style="margin: 0; color: var(--mute); line-height: 1.6">Charging problems, software trouble and general tune-ups.</p></article>
      <article style="border-radius: 22px; padding: 30px; background: var(--violet); color: #fff; display: flex; flex-direction: column; gap: 12px; min-height: 230px"><span style="font-size: 64px; font-weight: 800; line-height: .9">5.0</span><h3 style="margin: 0; font-size: 22px">Google rating</h3><p style="margin: 0; color: #DCD5FF; line-height: 1.6">A 5.0 average from 31 Google reviews, and 100% recommend on Facebook.</p></article>
    </div>
  </section>

  <section id="contact" style="background: var(--card)">
    <div style="max-width: 1300px; margin: 0 auto; padding: 90px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: clamp(38px, 5vw, 66px); line-height: 1; font-weight: 800; letter-spacing: -.02em">Drop Craig a line</h2>
        <p style="margin: 0; font-size: 18px; color: var(--mute)">Coverdale Road, Riverview, NB · just across the river from Moncton</p>
        <p style="margin: 0; font-size: 18px; color: var(--mute)">Weekday evenings, 6 – 8 pm</p>
        <p style="margin: 6px 0 0; font-size: 24px; font-weight: 800"><a href="tel:+15063808539" style="color: var(--violet)">506-380-8539</a></p>
        <p style="margin: 0; color: var(--mute)">craigduff@email.com</p>
      </div>
      <form aria-label="Contact DuffTech" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; padding: 30px; border-radius: 24px; background: var(--bg)">
        <label style="display: grid; gap: 8px; font-weight: 600">Name<input type="text" style="min-height: 54px; padding: 0 14px; border: 2px solid #DADDEA; border-radius: 12px; font: 400 16px Oxanium, sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 600">Phone or email<input type="text" style="min-height: 54px; padding: 0 14px; border: 2px solid #DADDEA; border-radius: 12px; font: 400 16px Oxanium, sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">I'm looking for<select style="min-height: 54px; padding: 0 14px; border: 2px solid #DADDEA; border-radius: 12px; font: 400 16px Oxanium, sans-serif"><option>A custom gaming PC</option><option>A computer repair</option><option>A laptop or tablet repair</option></select></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">Details<textarea rows="3" style="padding: 12px 14px; border: 2px solid #DADDEA; border-radius: 12px; font: 400 16px Oxanium, sans-serif"></textarea></label>
        <button type="button" class="dt-btn" style="grid-column: 1 / -1; background: var(--violet); color: #fff">Send to Craig</button>
      </form>
    </div>
  </section>
  <footer style="background: var(--ink); color: #A9AEC8">
    <div style="max-width: 1300px; margin: 0 auto; padding: 28px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; font-size: 14px"><span style="color: #fff; font-weight: 800">DuffTech</span><span>Riverview, New Brunswick · 506-380-8539</span></div>
  </footer>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for DuffTech. Not the official DuffTech website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { t: 1 }; }
  renderVals() {
    var self = this;
    var tiers = [
      { name: "Starter", sub: "Fortnite, Valorant, Minecraft at 1080p", target: "1080p high", parts: [["Processor", "6-core current-gen"], ["Graphics", "Entry 1080p card"], ["Memory", "16 GB"], ["Storage", "1 TB NVMe SSD"], ["Case", "Airflow case, RGB fans"]] },
      { name: "Mid", sub: "Big new releases at 1440p", target: "1440p high", parts: [["Processor", "8-core current-gen"], ["Graphics", "1440p-class card"], ["Memory", "32 GB"], ["Storage", "2 TB NVMe SSD"], ["Case", "Glass side, RGB fans"]] },
      { name: "High", sub: "4K and high-refresh streaming", target: "4K / high refresh", parts: [["Processor", "High-end 8+ core"], ["Graphics", "4K-class card"], ["Memory", "32–64 GB"], ["Storage", "2 TB+ NVMe SSD"], ["Cooling", "AIO liquid cooler"]] }
    ];
    var cur = tiers[this.state.t];
    return {
      tiers: tiers.map(function (t, i) {
        var on = i === self.state.t;
        return { name: t.name, sub: t.sub, sel: on ? "true" : "false", pick: function () { self.setState({ t: i }); },
          style: on ? "background:#B6F23A;color:#171A2B;border:2px solid #B6F23A" : "background:#1E2238;color:#fff;border:2px solid #333855" };
      }),
      cur: { name: cur.name, target: cur.target, parts: cur.parts.map(function (p) { return { k: p[0], v: p[1] }; }) }
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
