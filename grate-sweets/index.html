<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for Grate Sweets &amp; Treats</title>
<meta name="description" content="A sample homepage design made for Grate Sweets &amp; Treats by Hashay Patel. Not the official Grate Sweets &amp; Treats website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFF8EF}
*{box-sizing:border-box}
.gs{--cream:#FFF8EF;--pink:#F59AB4;--blush:#FCD9E3;--mint:#BDE8D3;--butter:#FFE59A;--lilac:#D8C5F2;--choc:#4A2C2A;--cookie:#E2A963;font-family:Fredoka,system-ui,sans-serif;color:var(--choc);background:var(--cream)}
.gs h1,.gs h2,.gs h3{font-weight:700;letter-spacing:-.02em}
@keyframes gsIce{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0}}
@keyframes gsFall{0%{transform:translateY(-60px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(420px) rotate(260deg);opacity:0}}
@keyframes gsBob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(4deg)}}
.gs-ice{stroke-dasharray:900;animation:gsIce 4s ease-in-out infinite alternate}
.gs-sp{transform-box:fill-box;transform-origin:center;animation:gsFall 5s linear infinite}
.gs-bob{transform-origin:50% 50%;animation:gsBob 6s ease-in-out infinite}
.gs-btn{display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;border-radius:999px;font:600 17px Fredoka,sans-serif;text-decoration:none;border:0;cursor:pointer}
.gs-btn:focus-visible,.gs-sw:focus-visible,.gs-tg:focus-visible{outline:3px solid var(--choc);outline-offset:3px}
.gs-sw{width:52px;height:52px;border-radius:50%;cursor:pointer}
.gs-tg{min-height:48px;padding:0 18px;border-radius:999px;cursor:pointer;font:600 15px Fredoka,sans-serif}
.gs-nav a{color:var(--choc);text-decoration:none;font-weight:500}
.gs-nav a:hover{color:#C2557A}
@media (max-width:820px){.gs-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.gs-ice,.gs-sp,.gs-bob{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="gs">
  <header style="max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--choc)">
      <svg aria-hidden="true" width="44" height="44" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20" fill="#E2A963"/><circle cx="22" cy="22" r="15" fill="#F59AB4"/><g fill="#fff"><rect x="15" y="15" width="5" height="2" rx="1" transform="rotate(30 17 16)"/><rect x="25" y="24" width="5" height="2" rx="1" transform="rotate(-20 27 25)"/><circle cx="26" cy="15" r="1.6"/><circle cx="17" cy="27" r="1.6"/></g></svg>
      <span style="font-weight: 700; font-size: 21px; line-height: 1.05; white-space: nowrap">Grate Sweets<span style="display: block; font-weight: 500; font-size: 13px; color: #C2557A">&amp; Treats · Grande Prairie</span></span>
    </a>
    <nav class="gs-nav" aria-label="Main" style="display: flex; gap: 28px"><a href="#design">Design a cookie</a><a href="#classes">Classes</a><a href="#treats">Treats</a><a href="#order">Order</a></nav>
    <a class="gs-btn" href="#order" style="min-height: 46px; padding: 0 20px; background: var(--choc); color: var(--cream); white-space: nowrap">Order</a>
  </header>

  <section id="top" style="position: relative; overflow: hidden">
    <div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
      <span class="gs-sp" style="position: absolute; left: 8%; top: 0; width: 8px; height: 22px; border-radius: 4px; background: var(--pink)"></span>
      <span class="gs-sp" style="position: absolute; left: 22%; top: 0; width: 8px; height: 22px; border-radius: 4px; background: #8FD3B4; animation-delay: -1.5s"></span>
      <span class="gs-sp" style="position: absolute; left: 47%; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--lilac); animation-delay: -3s"></span>
      <span class="gs-sp" style="position: absolute; left: 63%; top: 0; width: 8px; height: 22px; border-radius: 4px; background: #F6C945; animation-delay: -2.2s"></span>
      <span class="gs-sp" style="position: absolute; left: 88%; top: 0; width: 12px; height: 12px; border-radius: 50%; background: var(--pink); animation-delay: -4s"></span>
      <span class="gs-sp" style="position: absolute; left: 95%; top: 0; width: 8px; height: 22px; border-radius: 4px; background: #8FD3B4; animation-delay: -.7s"></span>
    </div>
    <div style="position: relative; max-width: 1280px; margin: 0 auto; padding: 24px 24px 90px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 500px), 1fr)); gap: 40px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-wrap: wrap; gap: 10px">
          <span style="padding: 8px 14px; border-radius: 999px; background: var(--butter); font-weight: 600; font-size: 14px">100% recommend on Facebook · 43 reviews</span>
          <span style="padding: 8px 14px; border-radius: 999px; background: var(--mint); font-weight: 600; font-size: 14px">★ 5.0 on Google</span>
        </div>
        <h1 style="margin: 0; font-size: clamp(54px, 7vw, 100px); line-height: .96">Cookies you'll want to decorate yourself.</h1>
        <p style="margin: 0; font-size: 19px; line-height: 1.65; color: #6E5250; max-width: 520px">Custom sugar cookies, authentic Costa Rican pastries, tea globes, gourmet caramel apples, and decorating classes for groups, parties and first-timers in Grande Prairie.</p>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <a class="gs-btn" href="#classes" style="background: var(--pink); color: var(--choc)">Book a class</a>
          <a class="gs-btn" href="#order" style="background: #fff; color: var(--choc); box-shadow: inset 0 0 0 2px var(--choc)">Order custom cookies</a>
        </div>
      </div>
      <div style="display: grid; place-items: center">
        <svg class="gs-bob" role="img" aria-label="A big sugar cookie being iced in pink with a piped white border and sprinkles" viewBox="0 0 420 420" style="display: block; width: min(100%, 480px); height: auto">
          <circle cx="210" cy="218" r="182" fill="#C88B4A"/>
          <circle cx="210" cy="210" r="182" fill="#E2A963"/>
          <path d="M210 52 C300 52 368 120 368 210 C368 300 300 368 210 368 C120 368 52 300 52 210 C52 120 120 52 210 52Z" fill="#F59AB4"/>
          <path class="gs-ice" d="M210 66 C292 66 354 128 354 210 C354 292 292 354 210 354 C128 354 66 292 66 210 C66 128 128 66 210 66Z" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round"/>
          <path class="gs-ice" style="animation-delay:.5s" d="M140 200 q35 -50 70 0 t70 0" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round"/>
          <path class="gs-ice" style="animation-delay:1s" d="M150 260 q30 30 60 0 q30 30 60 0" fill="none" stroke="#FFE59A" stroke-width="10" stroke-linecap="round"/>
          <g><rect x="130" y="130" width="22" height="8" rx="4" fill="#8FD3B4" transform="rotate(30 141 134)"/><rect x="270" y="140" width="22" height="8" rx="4" fill="#F6C945" transform="rotate(-25 281 144)"/><rect x="290" y="270" width="22" height="8" rx="4" fill="#D8C5F2" transform="rotate(50 301 274)"/><rect x="110" y="270" width="22" height="8" rx="4" fill="#fff" transform="rotate(-40 121 274)"/><circle cx="210" cy="120" r="6" fill="#fff"/><circle cx="320" cy="210" r="6" fill="#8FD3B4"/><circle cx="210" cy="310" r="6" fill="#F6C945"/><circle cx="100" cy="210" r="6" fill="#D8C5F2"/></g>
        </svg>
      </div>
    </div>
  </section>

  <section id="design" style="background: var(--blush)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 96px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-size: clamp(44px, 5.4vw, 72px); line-height: 1">Design your cookie</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.65; color: #6E5250; max-width: 470px">Pick an icing colour and a topping. Send us the idea for a party, a shower or a thank-you box and we'll bake it for real.</p>
        <div>
          <p style="margin: 0 0 10px; font-weight: 600">Icing</p>
          <div role="group" aria-label="Icing colour" style="display: flex; flex-wrap: wrap; gap: 10px">
            <sc-for list="{{ icings }}" as="c" hint-placeholder-count="5"><button type="button" class="gs-sw" aria-label="{{ c.name }}" aria-pressed="{{ c.on }}" onClick="{{ c.pick }}" style="{{ c.style }}"></button></sc-for>
          </div>
        </div>
        <div>
          <p style="margin: 0 0 10px; font-weight: 600">Topping</p>
          <div role="group" aria-label="Topping" style="display: flex; flex-wrap: wrap; gap: 8px">
            <sc-for list="{{ tops }}" as="t" hint-placeholder-count="3"><button type="button" class="gs-tg" aria-pressed="{{ t.on }}" onClick="{{ t.pick }}" style="{{ t.style }}">{{ t.name }}</button></sc-for>
          </div>
        </div>
      </div>
      <div style="border-radius: 40px; background: #fff; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 14px">
        <svg role="img" aria-label="{{ alt }}" viewBox="0 0 300 300" style="display: block; width: min(100%, 360px); height: auto">
          <circle cx="150" cy="156" r="130" fill="#C88B4A"/><circle cx="150" cy="150" r="130" fill="#E2A963"/>
          <circle cx="150" cy="150" r="112" fill="{{ ice }}" style="transition: fill .3s"/>
          <circle cx="150" cy="150" r="102" fill="none" stroke="#fff" stroke-width="8" stroke-dasharray="2 14" stroke-linecap="round"/>
          <g style="opacity: {{ spr }}; transition: opacity .3s"><rect x="100" y="100" width="18" height="6" rx="3" fill="#8FD3B4" transform="rotate(30 109 103)"/><rect x="180" y="110" width="18" height="6" rx="3" fill="#F6C945" transform="rotate(-25 189 113)"/><rect x="190" y="190" width="18" height="6" rx="3" fill="#fff" transform="rotate(50 199 193)"/><rect x="95" y="185" width="18" height="6" rx="3" fill="#D8C5F2" transform="rotate(-40 104 188)"/><rect x="140" y="140" width="18" height="6" rx="3" fill="#fff" transform="rotate(10 149 143)"/><rect x="150" y="80" width="18" height="6" rx="3" fill="#F59AB4" transform="rotate(70 159 83)"/><rect x="215" y="150" width="18" height="6" rx="3" fill="#8FD3B4" transform="rotate(-60 224 153)"/><rect x="80" y="145" width="18" height="6" rx="3" fill="#F6C945" transform="rotate(20 89 148)"/></g>
          <g style="opacity: {{ hrt }}; transition: opacity .3s"><path d="M150 205 C100 170 95 125 125 115 C140 110 150 122 150 130 C150 122 160 110 175 115 C205 125 200 170 150 205Z" fill="#fff"/></g>
          <g style="opacity: {{ drz }}; transition: opacity .3s" fill="none" stroke="#4A2C2A" stroke-width="5" stroke-linecap="round"><path d="M70 120 q40 -30 80 0 t80 0"/><path d="M62 160 q44 -30 88 0 t88 0"/><path d="M74 200 q38 -30 76 0 t76 0"/></g>
        </svg>
        <p style="margin: 0; font-weight: 600">{{ label }}</p>
      </div>
    </div>
  </section>

  <section id="classes" style="max-width: 1280px; margin: 0 auto; padding: 96px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 16px">
      <h2 style="margin: 0; font-size: clamp(44px, 5.4vw, 72px); line-height: 1">Cookie decorating classes</h2>
      <p style="margin: 0; font-size: 18px; line-height: 1.65; color: #6E5250; max-width: 480px">Learn to flood, pipe and sprinkle like a pro, then take your cookies home. No experience needed.</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 16px">
      <article style="padding: 30px; border-radius: 30px; background: var(--mint); display: flex; flex-direction: column; gap: 10px"><h3 style="margin: 0; font-size: 28px">Public classes</h3><p style="margin: 0; line-height: 1.6">Join a scheduled class, meet other cookie lovers, and decorate a themed set.</p><a href="#order" style="margin-top: 8px; color: var(--choc); font-weight: 600">See upcoming dates</a></article>
      <article style="padding: 30px; border-radius: 30px; background: var(--lilac); display: flex; flex-direction: column; gap: 10px"><h3 style="margin: 0; font-size: 28px">Private classes</h3><p style="margin: 0; line-height: 1.6">Birthdays, showers, team nights and friends' get-togethers, set up just for your group.</p><a href="#order" style="margin-top: 8px; color: var(--choc); font-weight: 600">Plan a private class</a></article>
    </div>
  </section>

  <section id="treats" style="background: var(--choc); color: var(--cream)">
    <div style="max-width: 1280px; margin: 0 auto; padding: 96px 24px">
      <h2 style="margin: 0 0 34px; font-size: clamp(44px, 5.4vw, 72px); line-height: 1">The treat counter</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px">
        <article style="padding: 26px; border-radius: 26px; background: var(--pink); color: var(--choc)"><h3 style="margin: 0 0 6px; font-size: 24px">Custom sugar cookies</h3><p style="margin: 0; line-height: 1.55">Iced to match your theme, colours and names.</p></article>
        <article style="padding: 26px; border-radius: 26px; background: var(--butter); color: var(--choc)"><h3 style="margin: 0 0 6px; font-size: 24px">Costa Rican pastries</h3><p style="margin: 0; line-height: 1.55">Authentic recipes, baked the Costa Rican way.</p></article>
        <article style="padding: 26px; border-radius: 26px; background: var(--mint); color: var(--choc)"><h3 style="margin: 0 0 6px; font-size: 24px">Tea globes</h3><p style="margin: 0; line-height: 1.55">Drop one in hot water and watch it bloom.</p></article>
        <article style="padding: 26px; border-radius: 26px; background: var(--lilac); color: var(--choc)"><h3 style="margin: 0 0 6px; font-size: 24px">Gourmet caramel apples</h3><p style="margin: 0; line-height: 1.55">Crisp apples, thick caramel, generous toppings.</p></article>
      </div>
      <figure style="margin: 50px 0 0; padding: clamp(26px, 4vw, 44px); border-radius: 30px; background: rgba(255,248,239,.08); display: flex; flex-direction: column; gap: 12px">
        <span aria-hidden="true" style="color: var(--butter)">★★★★★</span>
        <blockquote style="margin: 0; font-size: clamp(26px, 3.4vw, 42px); line-height: 1.2; font-weight: 600">"The best treats ever and sooo worth the indulgence"</blockquote>
        <figcaption style="font-size: 15px; opacity: .75">Google review</figcaption>
      </figure>
    </div>
  </section>

  <section id="order" style="max-width: 1280px; margin: 0 auto; padding: 90px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr)); gap: 40px; align-items: start">
    <div style="display: flex; flex-direction: column; gap: 14px">
      <h2 style="margin: 0; font-size: clamp(44px, 5.4vw, 72px); line-height: 1">Order or book a class</h2>
      <p style="margin: 0; font-size: 18px; color: #6E5250">Grande Prairie, Alberta</p>
      <p style="margin: 0; font-size: 20px; font-weight: 600">gratesweets@gmail.com</p>
    </div>
    <form aria-label="Order or class request" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 14px; background: #fff; padding: 26px; border-radius: 30px; border: 2px solid var(--blush)">
      <label style="display: grid; gap: 8px; font-weight: 600">Name<input type="text" style="min-height: 52px; padding: 0 14px; border: 2px solid #F3DCE3; border-radius: 16px; font: 400 16px Fredoka, sans-serif"></label>
      <label style="display: grid; gap: 8px; font-weight: 600">I'd like<select style="min-height: 52px; padding: 0 14px; border: 2px solid #F3DCE3; border-radius: 16px; font: 400 16px Fredoka, sans-serif"><option>Custom cookies</option><option>A public class</option><option>A private class</option><option>Pastries or treats</option></select></label>
      <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">Date and details<textarea rows="3" style="padding: 12px 14px; border: 2px solid #F3DCE3; border-radius: 16px; font: 400 16px Fredoka, sans-serif"></textarea></label>
      <button type="button" class="gs-btn" style="grid-column: 1 / -1; background: var(--pink); color: var(--choc)">Send my request</button>
    </form>
  </section>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for Grate Sweets &amp; Treats. Not the official Grate Sweets &amp; Treats website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { c: 0, t: 0 }; }
  renderVals() {
    var self = this;
    var cs = [{ n: "Pink", v: "#F59AB4" }, { n: "Mint", v: "#9EDDBF" }, { n: "Butter", v: "#FFDF7E" }, { n: "Lilac", v: "#C9B0EE" }, { n: "Sky", v: "#9CCFF0" }];
    var ts = ["Sprinkles", "Heart", "Chocolate drizzle"];
    var c = this.state.c, t = this.state.t;
    return {
      icings: cs.map(function (x, i) { var on = i === c; return { name: x.n + " icing", on: on ? "true" : "false", pick: function () { self.setState({ c: i }); }, style: "background:" + x.v + ";border:" + (on ? "4px solid #4A2C2A" : "4px solid #fff") + ";box-shadow:0 0 0 2px " + (on ? "#fff" : "#EBC9D3") }; }),
      tops: ts.map(function (x, i) { var on = i === t; return { name: x, on: on ? "true" : "false", pick: function () { self.setState({ t: i }); }, style: on ? "background:#4A2C2A;color:#FFF8EF;border:2px solid #4A2C2A" : "background:#fff;color:#4A2C2A;border:2px solid #EBC9D3" }; }),
      ice: cs[c].v, spr: t === 0 ? 1 : 0, hrt: t === 1 ? 1 : 0, drz: t === 2 ? 1 : 0,
      label: cs[c].n + " icing with " + ts[t].toLowerCase(),
      alt: "Cookie preview with " + cs[c].n.toLowerCase() + " icing and " + ts[t].toLowerCase()
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
