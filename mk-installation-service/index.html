<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sample homepage for MK Installation Service</title>
<meta name="description" content="A sample homepage design made for MK Installation Service by Hashay Patel. Not the official MK Installation Service website.">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EFE3CC}
*{box-sizing:border-box}
.mk{--ply:#EFE3CC;--grain:#E2CFAE;--teal:#0E4D5A;--teal2:#14707F;--tape:#F2C230;--ink:#14262B;--wall:#F8F4EC;font-family:'Familjen Grotesk',system-ui,sans-serif;color:var(--ink);background:var(--ply)}
.mk-wood{background-color:var(--ply);background-image:repeating-linear-gradient(100deg,rgba(201,170,120,.18) 0 2px,transparent 2px 22px),repeating-linear-gradient(80deg,rgba(201,170,120,.12) 0 1px,transparent 1px 37px)}
@keyframes mkWire{from{stroke-dashoffset:520}to{stroke-dashoffset:0}}
@keyframes mkBubble{0%,100%{transform:translateX(-8px)}50%{transform:translateX(8px)}}
@keyframes mkDrill{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
.mk-wire{stroke-dasharray:520;animation:mkWire 3s ease-out infinite alternate}
.mk-bub{animation:mkBubble 2.6s ease-in-out infinite}
.mk-drill{transform-box:fill-box;transform-origin:80% 50%;animation:mkDrill .25s linear infinite}
.mk-btn{display:inline-flex;align-items:center;justify-content:center;min-height:58px;padding:0 26px;border-radius:10px;font:700 17px 'Familjen Grotesk',sans-serif;text-decoration:none;border:0;cursor:pointer}
.mk-btn:focus-visible,.mk-job:focus-visible{outline:3px solid var(--tape);outline-offset:3px}
.mk-job{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:0 18px;border-radius:12px;cursor:pointer;font:600 17px 'Familjen Grotesk',sans-serif;text-align:left}
.mk-nav a{color:var(--ink);text-decoration:none;font-weight:600}
.mk-nav a:hover{color:var(--teal2)}
@media (max-width:820px){.mk-nav{display:none !important}}
@media (prefers-reduced-motion:reduce){.mk-wire,.mk-bub,.mk-drill{animation:none}}
</style>

</head>
<body>
<template id="dc-tpl">


<div class="mk mk-wood">
  <header style="max-width: 1280px; margin: 0 auto; padding: 22px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px">
    <a href="#top" style="display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink)">
      <span aria-hidden="true" style="display: grid; place-items: center; width: 48px; height: 48px; border-radius: 10px; background: var(--teal); color: var(--tape); font-weight: 700; font-size: 22px; letter-spacing: -.04em">MK</span>
      <span style="display: flex; flex-direction: column; line-height: 1.1"><span style="font-size: 21px; font-weight: 700">MK Installation Service</span><span style="font-size: 14px; color: #4D5E62">Lethbridge &amp; surrounding area</span></span>
    </a>
    <nav class="mk-nav" aria-label="Main" style="display: flex; gap: 30px"><a href="#jobs">Your to-do list</a><a href="#reviews">Reviews</a><a href="#contact">Contact</a></nav>
    <a class="mk-btn" href="tel:+15874321367" style="min-height: 48px; background: var(--teal); color: #fff">587-432-1367</a>
  </header>

  <section id="top" style="max-width: 1280px; margin: 0 auto; padding: 24px 24px 90px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 44px; align-items: center">
    <div style="display: flex; flex-direction: column; gap: 24px">
      <p style="margin: 0; align-self: flex-start; padding: 9px 16px; border-radius: 999px; background: var(--tape); font-weight: 700">★ 5.0 from 90 Google reviews</p>
      <h1 style="margin: 0; font-size: clamp(54px, 7.2vw, 104px); line-height: .92; font-weight: 700; letter-spacing: -.035em">The jobs on your list, done right the first time.</h1>
      <p style="margin: 0; font-size: 19px; line-height: 1.65; color: #3F5055; max-width: 520px">TV mounting, hidden wiring, closets, shelving, doors and trim. Mohammad installs and fixes the things around the house you've been meaning to get to, seven days a week.</p>
      <div style="display: flex; flex-wrap: wrap; gap: 12px">
        <a class="mk-btn" href="#jobs" style="background: var(--teal); color: #fff">Build my to-do list</a>
        <a class="mk-btn" href="tel:+15874321367" style="background: var(--wall); color: var(--ink); box-shadow: inset 0 0 0 2px var(--ink)">Call Mohammad</a>
      </div>
    </div>
    <figure style="margin: 0; position: relative">
      <svg role="img" aria-label="A living room wall with a mounted TV, its cable hidden in a channel, a floating shelf and a spirit level" viewBox="0 0 600 540" style="display: block; width: 100%; height: auto; border-radius: 28px; box-shadow: 0 40px 70px -40px rgba(20,38,43,.6)">
        <rect width="600" height="540" fill="#F8F4EC"/>
        <rect y="440" width="600" height="100" fill="#C9AA78"/><g stroke="#B08F5C" stroke-width="2"><path d="M0 470 H600 M0 505 H600"/><path d="M120 440 V470 M330 440 V470 M520 440 V470 M60 470 V505 M260 470 V505 M450 470 V505"/></g>
        <rect y="428" width="600" height="14" fill="#E9DFCB"/>
        <rect x="140" y="90" width="320" height="190" rx="10" fill="#14262B"/><rect x="152" y="102" width="296" height="166" rx="4" fill="#14707F"/>
        <path d="M152 230 L250 160 L320 210 L380 170 L448 220 V268 H152Z" fill="#0E4D5A"/><circle cx="400" cy="140" r="18" fill="#F2C230"/>
        <rect x="285" y="280" width="30" height="148" rx="4" fill="#E9DFCB" stroke="#D3C6AE" stroke-width="2"/>
        <path class="mk-wire" d="M300 282 V428" stroke="#14262B" stroke-width="5" fill="none"/>
        <rect x="340" y="350" width="200" height="16" rx="3" fill="#8B6A3E"/>
        <g><rect x="360" y="312" width="34" height="38" rx="4" fill="#0E4D5A"/><rect x="400" y="300" width="22" height="50" rx="3" fill="#F2C230"/><circle cx="470" cy="332" r="18" fill="#14707F"/></g>
        <g transform="translate(60 360)"><rect x="0" y="0" width="190" height="34" rx="8" fill="#F2C230" stroke="#14262B" stroke-width="3"/><rect x="70" y="8" width="50" height="18" rx="9" fill="#BFE8D2" stroke="#14262B" stroke-width="2"/><circle class="mk-bub" cx="95" cy="17" r="6" fill="#fff"/><path d="M95 8 V26" stroke="#14262B" stroke-width="1.5"/></g>
        <g transform="translate(440 410)"><g class="mk-drill"><rect x="0" y="-26" width="90" height="34" rx="10" fill="#14707F"/><rect x="-28" y="-14" width="30" height="10" rx="3" fill="#9AA6A8"/><rect x="48" y="4" width="26" height="42" rx="6" fill="#14262B"/></g></g>
      </svg>
      <figcaption style="position: absolute; left: -14px; top: 28px; background: var(--teal); color: #fff; padding: 14px 18px; border-radius: 14px; font-weight: 600; max-width: 230px; line-height: 1.35">Cables hidden, TV level, shelf solid. That's the job.</figcaption>
    </figure>
  </section>

  <section id="jobs" style="background: var(--teal); color: #fff">
    <div style="max-width: 1280px; margin: 0 auto; padding: 100px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 44px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 18px">
        <h2 style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: 1; letter-spacing: -.03em">What's on your list?</h2>
        <p style="margin: 0; font-size: 18px; line-height: 1.65; color: #CFE3E6; max-width: 460px">Tap everything that needs doing, then send the whole list so Mohammad can plan the visit around it.</p>
        <ul style="margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 10px">
          <sc-for list="{{ jobs }}" as="j" hint-placeholder-count="6">
            <li><button type="button" class="mk-job" aria-pressed="{{ j.on }}" onClick="{{ j.toggle }}" style="{{ j.style }}"><span aria-hidden="true" style="font-size: 24px">{{ j.icon }}</span><span style="flex: 1">{{ j.name }}</span><span aria-hidden="true" style="{{ j.box }}">{{ j.mark }}</span></button></li>
          </sc-for>
        </ul>
      </div>
      <aside aria-label="Your to-do list" style="position: relative; background: var(--wall); color: var(--ink); border-radius: 6px; padding: 34px 30px 30px; box-shadow: 0 30px 60px -30px rgba(0,0,0,.5); transform: rotate(1.2deg)">
        <span aria-hidden="true" style="position: absolute; top: -14px; left: 50%; width: 120px; height: 28px; margin-left: -60px; background: rgba(242,194,48,.85); transform: rotate(-3deg)"></span>
        <p style="margin: 0 0 6px; font-size: 26px; font-weight: 700">To-do for Mohammad</p>
        <p style="margin: 0 0 18px; color: #4D5E62">{{ count }}</p>
        <ol style="margin: 0; padding: 0 0 0 22px; display: grid; gap: 12px; font-size: 18px; min-height: 140px">
          <sc-for list="{{ picked }}" as="p" hint-placeholder-count="3"><li style="border-bottom: 1px dashed #D3C6AE; padding-bottom: 10px">{{ p.name }}</li></sc-for>
        </ol>
        <a class="mk-btn" href="tel:+15874321367" style="margin-top: 22px; width: 100%; background: var(--teal); color: #fff">Send this list by call or text</a>
      </aside>
    </div>
  </section>

  <section id="reviews" style="max-width: 1280px; margin: 0 auto; padding: 100px 24px">
    <div style="display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 18px; margin-bottom: 36px">
      <h2 style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: 1; letter-spacing: -.03em">Ninety reviews. 5.0 stars.</h2>
      <p style="margin: 0; font-weight: 600; color: #3F5055">Google reviews from Lethbridge homeowners</p>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px">
      <sc-for list="{{ reviews }}" as="r" hint-placeholder-count="3">
        <figure style="{{ r.style }}"><span aria-hidden="true" style="letter-spacing: 3px">★★★★★</span><blockquote style="margin: 0; font-size: 23px; line-height: 1.35; font-weight: 600">"{{ r.q }}"</blockquote><figcaption style="margin-top: auto; opacity: .75">Google review</figcaption></figure>
      </sc-for>
    </div>
  </section>

  <section id="contact" style="background: var(--ink); color: #fff">
    <div style="max-width: 1280px; margin: 0 auto; padding: 90px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: 40px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <h2 style="margin: 0; font-size: clamp(40px, 5vw, 66px); line-height: 1; letter-spacing: -.03em">Open 8 am to 8 pm, every day</h2>
        <p style="margin: 0; font-size: 18px; color: #B9C7CA">Serving Lethbridge and the surrounding area.</p>
        <p style="margin: 6px 0 0; font-size: 26px; font-weight: 700"><a href="tel:+15874321367" style="color: var(--tape)">587-432-1367</a></p>
        <p style="margin: 0; color: #B9C7CA">mohammad.kajkouly@gmail.com</p>
      </div>
      <form aria-label="Request a quote" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; background: #1E363C; padding: 30px; border-radius: 16px">
        <label style="display: grid; gap: 8px; font-weight: 600">Name<input type="text" style="min-height: 54px; padding: 0 14px; border: 0; border-radius: 10px; font: 400 16px 'Familjen Grotesk', sans-serif"></label>
        <label style="display: grid; gap: 8px; font-weight: 600">Phone<input type="tel" style="min-height: 54px; padding: 0 14px; border: 0; border-radius: 10px; font: 400 16px 'Familjen Grotesk', sans-serif"></label>
        <label style="grid-column: 1 / -1; display: grid; gap: 8px; font-weight: 600">What needs doing?<textarea rows="4" placeholder="e.g. Mount a 65&quot; TV and hide the cables" style="padding: 12px 14px; border: 0; border-radius: 10px; font: 400 16px 'Familjen Grotesk', sans-serif"></textarea></label>
        <button type="button" class="mk-btn" style="grid-column: 1 / -1; background: var(--tape); color: var(--ink)">Request a quote</button>
      </form>
    </div>
  </section>
  <footer style="background: #0B1719; color: #8FA2A6">
    <div style="max-width: 1280px; margin: 0 auto; padding: 26px 24px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; font-size: 14px"><span style="color: #fff; font-weight: 700">MK Installation Service</span><span>Lethbridge, Alberta · 587-432-1367</span></div>
  </footer>
</div>
</template>
<div id="dc-root"></div>
<div role="note" style="position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:9999;max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;background:rgba(20,20,20,.88);color:#fff;font:500 13px/1.35 system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25)">Sample design by Hashay Patel for MK Installation Service. Not the official MK Installation Service website.</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/morphdom/2.7.4/morphdom-umd.min.js"></script>
<script>
(function(){
  class DCLogic{constructor(p){this.props=p||{};this.state={}}
    setState(s){Object.assign(this.state,typeof s==='function'?s(this.state):s);render()}
    forceUpdate(){render()}}
  window.DCLogic=DCLogic;
  var TPL=document.getElementById('dc-tpl').innerHTML, root=document.getElementById('dc-root'), comp, fns=[];
  function look(p,c){var cur=c;p.split('.').forEach(function(k){cur=(cur!=null&&typeof cur==='object')?cur[k]:undefined});return cur}
  function esc(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;')}
  function fill(t,c){
    t=t.replace(/\son(\w+)="\{\{\s*([\w.$]+)\s*\}\}"/g,function(m,ev,p){var f=look(p,c);if(typeof f!=='function')return '';fns.push(f);return ' on'+ev.toLowerCase()+'="__dc('+(fns.length-1)+',event)"'});
    return t.replace(/\{\{\s*([\w.$]+)\s*\}\}/g,function(m,p){return esc(look(p,c))});
  }
  function build(){
    fns=[];var v=comp.renderVals();
    var t=TPL.replace(/<sc-for([^>]*)>([\s\S]*?)<\/sc-for>/g,function(m,a,inner){
      var l=(a.match(/list="\{\{\s*([\w.]+)\s*\}\}"/)||[])[1],as=(a.match(/as="(\w+)"/)||[])[1];
      var arr=look(l,v)||[];return arr.map(function(it){var c=Object.assign({},v);c[as]=it;return fill(inner,c)}).join('');
    });
    return fill(t,v);
  }
  window.__dc=function(i,e){if(fns[i])fns[i](e)};
  function render(){var n=document.createElement('div');n.id='dc-root';n.innerHTML=build();
    if(window.morphdom){morphdom(root,n)}else{root.innerHTML=n.innerHTML}}
  window.__dcStart=function(C){comp=new C({});render()};
})();
</script>
<script>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { on: { tv: true, wire: true, closet: true } }; }
  renderVals() {
    var self = this;
    var list = [
      ["tv", "📺", "Mount a TV"], ["wire", "🔌", "Hide wires and cables"], ["closet", "🚪", "Fix or build closets"],
      ["shelf", "🪚", "Put up shelves"], ["trim", "📏", "Doors, baseboards and trim"], ["flat", "🛋️", "Assemble furniture"]
    ];
    var on = this.state.on;
    var picked = list.filter(function (x) { return on[x[0]]; });
    return {
      jobs: list.map(function (x) {
        var y = !!on[x[0]];
        return { icon: x[1], name: x[2], on: y ? "true" : "false", mark: y ? "✓" : "",
          toggle: function () { var o = Object.assign({}, self.state.on); o[x[0]] = !o[x[0]]; self.setState({ on: o }); },
          style: y ? "background:#F2C230;color:#14262B;border:2px solid #F2C230" : "background:rgba(255,255,255,.06);color:#fff;border:2px solid rgba(255,255,255,.18)",
          box: "display:grid;place-items:center;width:28px;height:28px;border-radius:8px;font-weight:700;" + (y ? "background:#14262B;color:#F2C230" : "border:2px solid rgba(255,255,255,.4)") };
      }),
      picked: picked.length ? picked.map(function (x) { return { name: x[2] }; }) : [{ name: "Tap a job to add it" }],
      count: picked.length + (picked.length === 1 ? " job" : " jobs") + " so far",
      reviews: [
        { q: "Best small business service in years!", style: "margin:0;padding:30px;border-radius:16px;background:#F2C230;display:flex;flex-direction:column;gap:16px;min-height:240px" },
        { q: "Mohammed did a great job fixing a couple of closets in our basement bedrooms.", style: "margin:0;padding:30px;border-radius:16px;background:#F8F4EC;display:flex;flex-direction:column;gap:16px;min-height:240px" },
        { q: "His price was reasonable and he was very personable.", style: "margin:0;padding:30px;border-radius:16px;background:#0E4D5A;color:#fff;display:flex;flex-direction:column;gap:16px;min-height:240px" }
      ]
    };
  }
}

__dcStart(Component);</script>
</body>
</html>
